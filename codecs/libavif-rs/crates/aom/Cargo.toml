[package]
name = "libavif-aom"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause AND BSD-3-Clause AND MIT"
description = "Mechanical portable Rust translation of libaom 3.15.2"
repository = "https://github.com/sebastian-software/ferrisma"
include = ["/Cargo.toml", "/build.rs", "/README.md", "/NOTICE.md", "/LICENSES/**", "/src/**"]
publish = false

[lib]
name = "aom"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libc = "=0.2.191"
c2rust-bitfields = "=0.3.0"

[features]
port-test-bridges = []
port-macro-tests = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(libavif_rs_asan)"] }
