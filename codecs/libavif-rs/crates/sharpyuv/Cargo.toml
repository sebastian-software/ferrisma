[package]
name = "ferrisma-libavif-sharpyuv"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"
description = "SharpYUV 0.4.2 C ABI adapter over the shared safe conversion core"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
include = ["/Cargo.toml", "/build.rs", "/README.md", "/NOTICE.md", "/LICENSES/**", "/src/**"]
publish = ["crates-io"]

[lib]
name = "sharpyuv"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libc = "0.2.191"
ferrisma-sharpyuv = { path = "../../../../crates/libsharpyuv-core", version = "0.1.0" }

[dev-dependencies]
# Cross-port adoption evidence; this is not a production dependency.
ferrisma-libwebp = { path = "../../../libwebp-rs" }
