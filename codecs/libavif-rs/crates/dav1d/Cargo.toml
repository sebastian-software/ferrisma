[package]
name = "libavif-dav1d"
version = "0.1.0"
edition = "2021"
# C-variadic definitions and core::ffi::VaList are stable since 1.99 (port ADR 0060).
rust-version = "1.99"
license = "BSD-2-Clause"
description = "Mechanical portable Rust translation of dav1d 1.5.4"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
include = ["/Cargo.toml", "/build.rs", "/README.md", "/NOTICE.md", "/LICENSES/**", "/src/**"]
publish = false

[lib]
name = "dav1d"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# Test-only, not part of the crate's public contract (ADR 0062): exported
# accessors of rebuilt kernels that the original reaches without a DSP table
# (msac), for tools/check_dav1d_dsp.py --simd and
# tools/measure_dav1d_kernels.py. It adds those symbols and nothing else; no
# dependent enables it, and tools/check_dav1d_linkage.py rejects a product
# library that carries them.
port-test-bridges = []

[dependencies]
libc = "0.2.191"
c2rust-bitfields = "0.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(libavif_rs_asan)", "cfg(dav1d_portable)"] }
