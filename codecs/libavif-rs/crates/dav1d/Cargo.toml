[package]
name = "libavif-dav1d"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Mechanical portable Rust translation of dav1d 1.5.4"
repository = "https://github.com/sebastian-software/ferrisma"
include = ["/Cargo.toml", "/build.rs", "/README.md", "/NOTICE.md", "/LICENSES/**", "/src/**"]
publish = false

[lib]
name = "dav1d"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libc = "=0.2.191"
c2rust-bitfields = "=0.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(libavif_rs_asan)"] }
