[package]
name = "libjxl-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause AND MIT AND (Apache-2.0 WITH LLVM-exception)"
description = "A mechanical Rust port of the JPEG XL reference implementation"
repository = "https://github.com/sebastian-software/ferrisma"
# Upstream submodules, oracle tooling, and test data stay in the repository.
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/PATENTS", "/licenses/**", "/docs/PROVENANCE.md", "/src/**"]
publish = false

[lib]
name = "jxl"
# The rlib serves Rust callers and the tests. The static and dynamic libraries
# export the decoder C ABI of lib/include/jxl/decode.h (src/jxl/decode_abi.rs)
# for C programs. Building them compiles and links no C or C++ code.
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# The C++ oracle is an executable used by integration tests, never a dependency
# of the Rust library. Enabling this feature requires building it first.
cpp-oracle = []
# Opt-in to the translated skcms SKX (AVX-512) engine on x86_64. Off by
# default (decision D6): an AVX-512 CPU runs the HSW engine, as an original
# built with -DSKCMS_DISABLE_SKX does.
skcms-skx = []
# The NEON/AVX2 variant of the oracle for the SIMD paths (ADR 0004); its
# tests read JXL_CPP_ORACLE_SIMD. tools/check.py builds it for the host.
cpp-oracle-simd = ["cpp-oracle"]
