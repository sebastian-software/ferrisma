name: Generate native Linux libaom profiles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate, reproduce, compile, generate macro subjects, or check scalar DSP additions
        type: choice
        options: [generate, verify, compile, macros, dsp]
        default: generate

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CC: clang-16
      CXX: clang++-16
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-16
      LIBCLANG_PATH: /usr/lib/llvm-16/lib
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned translation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 llvm-16-dev libclang-16-dev ninja-build pkg-config python3-venv cmake
          rustup toolchain install nightly-2026-09-07 --profile minimal
          rustup toolchain install 1.80.1 --profile minimal
          if [ "${{ inputs.mode }}" != compile ] && [ "${{ inputs.mode }}" != dsp ]; then
            cargo +1.80.1 install c2rust --version 0.21.0 --locked
          fi
          python3 -m venv build/aom-tools
          build/aom-tools/bin/python -m pip install meson==1.7.2
      - name: Verify source and build the retained native VMAF reference
        run: |
          python3 tools/verify_upstream.py --tracked
          python3 tools/generate_licenses.py --check
          python3 tests/ports/aom_jumps_test.py
          python3 tools/build_aom_vmaf.py --fetch
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/build/aom-vmaf-install/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Check committed Rust types before building original consumers
        if: inputs.mode != 'generate'
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-07
        run: |
          cargo check -p libavif-aom --locked
          cargo check -p libavif-aom --locked --release
          cargo run -p libavif-aom --example raw_api --locked
      - name: Build both original portable profiles
        run: |
          python3 tools/build_aom.py --debug
          python3 tools/build_aom.py
      - name: Translate both complete native Linux source profiles
        if: inputs.mode == 'generate' || inputs.mode == 'verify'
        env:
          RUST_BACKTRACE: "1"
        run: |
          if [ "${{ inputs.mode }}" = generate ]; then
            python3 tools/transpile_aom.py
            python3 tools/transpile_aom.py --release
            python3 tools/transpile_aom_macros.py
            python3 tools/transpile_aom_macros.py --release
          else
            python3 tools/transpile_aom.py --check
            python3 tools/transpile_aom.py --release --check
            python3 tools/transpile_aom_macros.py --check
            python3 tools/transpile_aom_macros.py --release --check
          fi
      - name: Generate optional original macro subjects
        if: inputs.mode == 'macros'
        run: |
          python3 tools/transpile_aom_macros.py
          python3 tools/transpile_aom_macros.py --release
      - name: Compile both generated profiles and compare public codec output
        id: consumers
        if: inputs.mode != 'macros' && inputs.mode != 'dsp'
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-07
        run: |
          python3 tools/check_translation.py
          python3 tools/build_aom_consumers.py --debug --only aomenc --only aomdec --only test_libaom
          python3 tools/build_aom_consumers.py --only aomenc --only aomdec --only test_libaom
          python3 tools/check_aom_roundtrip.py --debug
          python3 tools/check_aom_roundtrip.py
          python3 tools/check_aom_cli.py --debug
          python3 tools/check_aom_cli.py
          cargo test -p libavif-aom --locked
          cargo run -p libavif-aom --example raw_api --locked
          cargo run -p libavif-aom --example raw_api --locked --release
          python3 tools/check_aom_linkage.py --debug
          python3 tools/check_aom_linkage.py
          python3 tools/check_aom_inlines.py --debug
          python3 tools/check_aom_inlines.py
          python3 tools/check_aom_macros.py --debug
          python3 tools/check_aom_macros.py
          python3 tools/check_aom_oracles.py --debug
          python3 tools/check_aom_oracles.py
          python3 tools/check_aom_oracles.py --debug --suite softmax
          python3 tools/check_aom_oracles.py --suite softmax
          python3 tools/check_aom_oracles.py --debug --suite intrabc
          python3 tools/check_aom_oracles.py --suite intrabc
          python3 tools/check_aom_oracles.py --debug --suite kmeans
          python3 tools/check_aom_oracles.py --suite kmeans
          python3 tools/check_aom_oracles.py --debug --suite nn-predict
          python3 tools/check_aom_oracles.py --suite nn-predict
      - name: Compare original 2D and compound convolution reference roles
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          python3 tools/check_aom_oracles.py --debug --suite convolution-2d
          python3 tools/check_aom_oracles.py --suite convolution-2d
          python3 tools/check_aom_oracles.py --debug --suite compound
          python3 tools/check_aom_oracles.py --suite compound
      - name: Compare supplementary scalar directional prediction
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          python3 tools/check_aom_oracles.py --debug --suite directional-prediction
          python3 tools/check_aom_oracles.py --suite directional-prediction
      - name: Compare supplementary scalar rounding and cubic interpolation
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          python3 tools/check_aom_oracles.py --debug --suite round-shift-array
          python3 tools/check_aom_oracles.py --suite round-shift-array
          python3 tools/check_aom_oracles.py --debug --suite cubic-rd
          python3 tools/check_aom_oracles.py --suite cubic-rd
      - name: Check only the supplementary scalar DSP additions
        if: inputs.mode == 'dsp'
        run: |
          cargo build -p libavif-aom --locked
          cargo build -p libavif-aom --locked --release
          for aom_suite in kmeans nn-predict directional-prediction round-shift-array cubic-rd; do
            python3 tools/check_aom_oracles.py --debug --suite "$aom_suite"
            python3 tools/check_aom_oracles.py --suite "$aom_suite"
          done
      - name: Compare native VMAF modes with the integer model
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          python3 tools/check_aom_vmaf.py --debug
          python3 tools/check_aom_vmaf.py
      - name: Compare native VMAF modes with the float model
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          python3 tools/check_aom_vmaf.py --debug --model float
          python3 tools/check_aom_vmaf.py --model float
      - name: Compare single-allocation failures
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          python3 tools/check_aom_faults.py --debug
          python3 tools/check_aom_faults.py
      - name: Compare worker-creation failures
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          python3 tools/check_aom_faults.py --debug --thread-failures
          python3 tools/check_aom_faults.py --thread-failures
      - name: Preserve focused original API and error registrations
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        run: |
          filter='AomImageTest.*:AomLeb128.*:DecodeAPI.*:EncodeAPI.Invalid*:FilmGrainTableIOTest.*:FilmGrainTableTest.*:MetadataTest.*:KeyValAPI/*.*:EncodeAPI.SizeAlignOverflow'
          python3 tools/run_aom_tests.py --debug --jobs 1 --shards 1 --filter "$filter"
          python3 tools/run_aom_tests.py --debug --rust --jobs 1 --shards 1 --filter "$filter"
          python3 tools/run_aom_tests.py --jobs 1 --shards 1 --filter "$filter"
          python3 tools/run_aom_tests.py --rust --jobs 1 --shards 1 --filter "$filter"
      - name: Compare named record layouts in both profiles
        if: ${{ !cancelled() && steps.consumers.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-07
        run: |
          python3 tools/check_aom_abi.py
          python3 tools/check_aom_abi.py --release
      - name: Preserve generated source and scoped pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aom-linux-generated
          path: |
            crates/aom/src/linux/
            crates/aom/src/modules-linux-*.rs
            crates/aom/src/api-linux-*.rs
            crates/aom/TRANSLATION-linux-*.json
            crates/aom/reference/linux/
            crates/aom/src/macros-linux-*.rs
            translations/aom-macros-linux-*.json
            build/aom-macro-translate/*/transpile.log
            build/aom-translate/*/transpile.log
            build/aom-translate/*/expected/
            build/aom-generated/
            build/aom-native-*/reference-profile.json
            build/aom-native-*/library-compile-commands.json
            build/aom-native-*/test_*-inventory.json
            build/aom-vmaf/reference-profile.json
            build/aom-rust-*/linkage.json
            build/aom-rust-*/symbol-audit.json
            build/aom-native-*/tests-focused-*/summary.json
            build/aom-rust-*/tests-focused-*/summary.json
            build/aom-abi-*/summary.json
            build/aom-cli-*/summary.json
            build/aom-cli-*/*-encode.log
            build/aom-cli-*/*-decode.log
            build/aom-roundtrip-*/summary.json
            build/aom-inlines-*/summary.json
            build/aom-macro-tests-*/summary.json
            build/aom-macro-tests-*/*.log
            build/aom-macro-tests-*/*.xml
            build/aom-reference-*/summary.json
            build/aom-oracles-*/summary.json
            build/aom-oracles-*/*.log
            build/aom-oracles-*/*.xml
            build/aom-faults-*/summary.json
            build/aom-faults-*/failure.log
            build/aom-faults-*/mismatch.json
            build/aom-thread-faults-*/summary.json
            build/aom-thread-faults-*/failure.log
            build/aom-thread-faults-*/mismatch.json
            build/aom-native-*/tests-focused-*/*.log
            build/aom-native-*/tests-focused-*/*.xml
            build/aom-native-*/tests-focused-*/shard-*.json
            build/aom-rust-*/tests-focused-*/*.log
            build/aom-rust-*/tests-focused-*/*.xml
            build/aom-rust-*/tests-focused-*/shard-*.json
            build/aom-vmaf-modes-*/summary.json
            build/aom-vmaf-modes-*/failure.json
            build/aom-vmaf-modes-*/*.log
