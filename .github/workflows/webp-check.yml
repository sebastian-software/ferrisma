# Codec checks share the workspace and keep their original oracle tiers.
name: 'WEBP: Checks'
'on':
  workflow_dispatch: null
  workflow_call:
permissions:
  contents: read
concurrency:
  group: webp-check-${{ github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CC: clang
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: 'WEBP: Checks (${{ matrix.os }})'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libwebp-rs/.github/actions/prepare
    - name: Check provenance, skeleton, links, formatting, Clippy and tests
      run: python3 tools/check.py
    - name: Tests of the scalar build (no SIMD modules, ADR 0008)
      run: python3 tools/check.py --stage test --no-simd
    defaults:
      run:
        working-directory: codecs/libwebp-rs
  msrv:
    name: 'WEBP: MSRV (Rust 1.95)'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libwebp-rs/.github/actions/prepare
      with:
        msrv: true
    - name: Build and test with the rust-version toolchain
      run: python3 tools/check.py --stage test --msrv
    defaults:
      run:
        working-directory: codecs/libwebp-rs
  oracle:
    name: 'WEBP: Oracle (${{ matrix.os }})'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libwebp-rs/.github/actions/prepare
    - name: Build the release, asan-ubsan and debug oracles
      run: python3 tools/build_oracle.py --variant all
    - name: Differential tests and baseline against the release oracle
      run: python3 tools/check.py --stage test --oracle-variant release --baseline
    - name: Differential tests and baseline against the asan-ubsan oracle
      run: python3 tools/check.py --stage test --oracle-variant asan-ubsan --baseline
    - name: Differential tests of the scalar build against the release oracle
      if: matrix.os == 'ubuntu-latest'
      run: python3 tools/check.py --stage test --oracle-variant release --no-simd
    - name: Baseline of the debug oracle
      run: python3 tools/oracle_baseline.py --variant debug
    - name: Keep the oracle and baseline records
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: webp-oracle-${{ matrix.os }}
        path: |
          codecs/libwebp-rs/build/oracle/*/oracle.json
          codecs/libwebp-rs/build/oracle/*/upstream-flags.txt
          codecs/libwebp-rs/build/oracle/*/baseline/baseline.json
          codecs/libwebp-rs/build/oracle/*/baseline/*.log
        if-no-files-found: error
        retention-days: 30
    defaults:
      run:
        working-directory: codecs/libwebp-rs
  bench:
    name: 'WEBP: Bench (ubuntu)'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libwebp-rs/.github/actions/prepare
    - name: Host
      run: |
        lscpu | grep 'Model name'
        rustc --version
    - name: DSP benchmarks
      run: cargo run --release --example dsp_bench
    defaults:
      run:
        working-directory: codecs/libwebp-rs
  checks-passed:
    name: 'WEBP: Checks passed'
    if: always()
    needs:
    - checks
    - msrv
    - oracle
    runs-on: ubuntu-latest
    steps:
    - name: Require every job to pass
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        # Only "success" passes: failure, cancelled, skipped, and the
        # "abandoned" that an Actions incident reports for jobs that never
        # ran (seen on 9 November 2026) all fail the gate.
        for result in $RESULTS; do
          [ "$result" = success ] || exit 1
        done
