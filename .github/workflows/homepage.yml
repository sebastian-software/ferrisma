name: Homepage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment in progress on `main` is never cancelled; pull requests are.
concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Guides link to source and workflow files as well as Markdown. Always build
  # the small site so a target deletion cannot bypass its link validation.
  build:
    name: Website build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: homepage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: homepage/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: homepage/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      # The Pages artifact is also the review artifact of a pull request. Hidden
      # files are included for `.well-known/`, which every page links to.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: homepage/build/client
          include-hidden-files: true
          retention-days: 14

  # Publishes the build to GitHub Pages (ferrisma.dev) from `main` only: on a
  # push, or on a manual run started from `main`. Pull requests and runs from
  # other branches stop after the build. Only this job may write to Pages.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The site is built for the domain root (base `/`, root-absolute asset
      # URLs). A CNAME file is ignored by Actions deployments: the custom
      # domain must be set in the repository's Pages settings, or the site
      # would land under /ferrisma/ with every asset URL broken.
      - name: Require the custom domain at the root
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$PAGES_BASE_URL" != "https://ferrisma.dev" ] && [ "$PAGES_BASE_URL" != "http://ferrisma.dev" ]; then
            echo "::error::GitHub Pages serves this repository at '$PAGES_BASE_URL', not at the root of ferrisma.dev. Set the custom domain in Settings > Pages."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
