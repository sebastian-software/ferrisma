name: M1 Decoder Fuzz Smoke

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Run the sustained campaign instead of the quick smoke
        type: boolean
        default: false
  workflow_call:

concurrency:
  group: m1-fuzz-smoke-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  fuzz:
    if: inputs.campaign != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Activate the pinned native toolchain
        run: rustup show active-toolchain
      - name: Install AV1 assembler
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Install pinned fuzz driver
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify real seeds reach both output encoders
        run: cargo test --locked --manifest-path fuzz/Cargo.toml --lib
      - name: Prepare real JPEG, JPEG XL, AVIF, and WebP corpus seeds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path("fuzz/corpus/transcode")
          target.mkdir(parents=True, exist_ok=True)
          for fmt, name, selector in [
              ("jpeg", "tests/fixtures/sample.jpg", 0),
              ("jxl", "tests/fixtures/sample.jxl", 1),
              ("avif", "tests/fixtures/orientation/avif-1.avif", 2),
              ("webp", "tests/fixtures/webp/reference-lossy.webp", 3),
          ]:
              for output, flag in [("avif", 0), ("webp", 4)]:
                  (target / f"seed-{fmt}-to-{output}").write_bytes(bytes([selector | flag]) + Path(name).read_bytes())
          print("Seeded eight input/output lanes from four checked-in image fixtures")
          PY
      - name: Run bounded decoder/processing fuzz smoke
        run: |
          cargo fuzz run transcode -- -runs=3000 -max_len=16384 -timeout=5 -rss_limit_mb=1024
      - name: Upload reproducible fuzz artifacts if a target crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-fuzz-artifacts
          path: |
            fuzz/artifacts/transcode/
            fuzz/corpus/transcode/
          if-no-files-found: ignore

  campaign:
    if: inputs.campaign == true
    uses: ./.github/workflows/m1-fuzz-campaign.yml
