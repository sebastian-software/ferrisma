# Throwaway diagnosis workflow (branch v1/dav1d-x86-segv only, never main): the ferrisma-dav1d lib tests'
# SIGSEGV of ci.yml run 45292330807 on hosted Linux x86-64.
# (Overwrites bench-blacksmith-probe.yml on this branch only, so that it can be dispatched by its path.)
name: dav1d x86 SIGSEGV probe
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Parallel test-binary runs per job
        default: "30"
permissions:
  contents: read
jobs:
  instrumented:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo fetch --locked
      - name: Gather indices of ipred_z2_8bpc outside its frame
        run: |
          grep -m1 'model name' /proc/cpuinfo
          git apply tools/segv-probe/instrument-z2.patch
          BIN=$(cargo test --locked --offline --release -p ferrisma-dav1d --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .profile.test) | .executable' | tail -1)
          "$BIN" --exact simd::x86::ipred::tests::the_kernels_read_only_the_edge_array > alone.log 2>&1; echo "alone rc=$?"
          for i in 1 2 3 4 5; do "$BIN" > par-$i.log 2>&1; echo "par $i rc=$?"; done
          echo "OOB lines: $(cat alone.log par-*.log | grep -c OOB)"
          grep -h OOB alone.log | sort | uniq -c | head -60
