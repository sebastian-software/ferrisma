# Throwaway diagnosis workflow (branch v1/dav1d-x86-segv only, never main): the ferrisma-dav1d lib tests'
# SIGSEGV of ci.yml run 45292330807 on hosted Linux x86-64.
# (Overwrites bench-blacksmith-probe.yml on this branch only, so that it can be dispatched by its path.)
name: dav1d x86 SIGSEGV probe
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Parallel test-binary runs per job
        default: "30"
permissions:
  contents: read
jobs:
  gdb:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q gdb
      - run: cargo fetch --locked
      - run: bash tools/segv-probe/gdb-regs.sh
