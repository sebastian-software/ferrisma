# Codec checks share the workspace and keep their original oracle tiers.
name: 'AVIF: AOM x86 SIMD validation'
'on':
  workflow_dispatch:
    inputs:
      measure:
        description: Also measure encoder time with each RTCD selection
        type: boolean
        default: false
      debug:
        description: Also run the kernel tests unoptimized in the Debug profile (about 40 minutes)
        type: boolean
        default: false
  workflow_call:
    inputs:
      measure:
        description: Also measure encoder time with each RTCD selection
        type: boolean
        default: false
      debug:
        description: Also run the kernel tests unoptimized in the Debug profile (about 40 minutes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: avif-aom-simd-linux-${{ github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  kernels:
    name: 'AVIF: kernels (${{ matrix.profile }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile:
        - release
        - checked
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Install the pinned toolchain
      run: rustup show active-toolchain
    - name: Record the runner CPU
      run: |
        grep -m1 'model name' /proc/cpuinfo
        grep -m1 -o -w -E 'sse4_1|avx2|avx512f' /proc/cpuinfo | sort -u
    - name: Compare the SIMD kernels with their C functions
      run: cargo test -p ferrisma-libaom --locked --profile ${{ matrix.profile }} --test simd
    defaults:
      run:
        working-directory: codecs/libavif-rs
  kernels-debug:
    name: 'AVIF: kernels (dev, unoptimized)'
    if: github.event_name == 'schedule' || inputs.debug
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Install the pinned toolchain
      run: rustup show active-toolchain
    - name: Record the runner CPU
      run: grep -m1 'model name' /proc/cpuinfo
    - name: Compare the SIMD kernels with their C functions
      run: cargo test -p ferrisma-libaom --locked --test simd
    defaults:
      run:
        working-directory: codecs/libavif-rs
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Install the pinned toolchain and ImageMagick
      run: |
        if ! command -v convert >/dev/null 2>&1; then
          sudo add-apt-repository -y universe || true
          for attempt in 1 2 3; do
            sudo apt-get update && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-get update failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          sudo apt-get install -y --no-install-recommends imagemagick
        fi
        rustup show active-toolchain
        command -v convert
    - name: Record the runner CPU
      run: |
        grep -m1 'model name' /proc/cpuinfo
        grep -m1 -o -w -E 'sse4_1|avx2|avx512f' /proc/cpuinfo | sort -u
    - name: Compare AVIF output with SIMD, SSE4.1 and C dispatch
      run: |
        if ! grep -q '"rtcd_dispatch"' crates/aom/TRANSLATION.json; then
          echo "The committed Linux profiles predate x86 dispatch; skipping the AVIF identity corpus."
          exit 0
        fi
        python3 tools/check_aom_simd_identity.py --output build/aom-simd-identity-validation-linux.json
    - name: Measure encoder time with SIMD, SSE4.1 and C dispatch
      if: inputs.measure
      run: |
        python3 tools/measure_aom_simd_speed.py --binary ../../target/release/examples/encode_still \
          --output build/aom-x86-performance.json
    - name: Preserve the identity report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: aom-simd-identity-linux
        path: |
          codecs/libavif-rs/build/aom-simd-identity-validation-linux.json
          codecs/libavif-rs/build/aom-x86-performance.json
        if-no-files-found: ignore
    name: 'AVIF: identity'
    defaults:
      run:
        working-directory: codecs/libavif-rs
  original:
    name: 'AVIF: SIMD against the original (x86-64 hardware)'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Install the pinned toolchain and the original's build tools
      run: |
        for attempt in 1 2 3; do
          sudo apt-get update && break
          if [ "$attempt" -eq 3 ]; then
            echo "::error::apt-get update failed after 3 attempts"
            exit 1
          fi
          sleep 10
        done
        sudo apt-get install -y --no-install-recommends nasm ninja-build libjpeg-turbo-progs
        rustup show active-toolchain
        command -v cmake nasm ninja djpeg
    - name: Record the runner CPU
      run: |
        grep -m1 'model name' /proc/cpuinfo
        grep -m1 -o -w -E 'sse4_1|avx2|avx512f' /proc/cpuinfo | sort -u
        if grep -q -w avx512f /proc/cpuinfo; then
          echo "AVX-512: yes (the avx2 level below is also the AVX2 cap check)"
        else
          echo "AVX-512: no"
        fi
    - name: Build the original libaom at the avx2 level and the generic level
      run: |
        python3 tools/build_aom.py --library-only --jobs 4
        python3 tools/build_aom.py --library-only --simd avx2 --jobs 4
    - name: Compare the port with the original at avx2, sse4.1 and scalar
      run: |
        python3 tools/check_aom_simd_original.py --jobs 4 \
          --output build/aom-simd-original-linux-x86_64.json
    - name: Preserve the comparison report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: aom-simd-original-linux
        path: codecs/libavif-rs/build/aom-simd-original-linux-x86_64.json
        if-no-files-found: ignore
    defaults:
      run:
        working-directory: codecs/libavif-rs
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Install the pinned toolchain
      run: rustup show active-toolchain
    - name: Record the runner CPU
      run: grep -m1 'model name' /proc/cpuinfo
    - name: Compare AVIF output with the golden record
      run: python3 tools/check_aom_golden.py --output build/aom-golden-linux-x86_64-release.json
    - name: Preserve the observed outputs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: aom-golden-linux
        path: codecs/libavif-rs/build/aom-golden-linux-x86_64-release.json
        if-no-files-found: ignore
    name: 'AVIF: golden'
    defaults:
      run:
        working-directory: codecs/libavif-rs
