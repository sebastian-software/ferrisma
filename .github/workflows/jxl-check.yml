# Codec checks share the workspace and keep their original oracle tiers.
# Two hosted tiers (ADR-0027, amendment 2026-11-17): `nightly` (tier 2, every
# job within 60 minutes) runs every test except the deep tier's on Linux with
# the ordinary and the sanitized oracle and, on the schedule or with `macos`,
# on macOS with the ordinary oracle; `deep` (tier 3, weekly and before a
# release candidate) runs the deep tier's tests on both and the whole suite
# with the sanitized oracle on macOS. tools/check.py holds the tiers and the
# shards (--plan), and the selection job fails unless the shards together ran
# every test of the tier.
name: 'JXL: Checks'
'on':
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the hosted macOS jobs of the nightly tier (the deep tier always runs them)
        type: boolean
        default: false
      tier:
        description: 'The hosted tier: nightly or deep'
        type: string
        default: nightly
  workflow_call:
    inputs:
      macos:
        description: Also run the hosted macOS jobs of the nightly tier (the deep tier always runs them)
        type: boolean
        default: false
      tier:
        description: 'The hosted tier: nightly or deep'
        type: string
        default: nightly
permissions:
  contents: read
concurrency:
  group: jxl-check-${{ github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CC: clang
  CXX: clang++
defaults:
  run:
    shell: bash
jobs:
  plan:
    name: 'JXL: Plan the ${{ inputs.tier }} tier'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parity: ${{ steps.plan.outputs.parity }}
      audit: ${{ steps.plan.outputs.audit }}
      capture: ${{ steps.plan.outputs.capture }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Choose the shards and audits of the tier
      id: plan
      env:
        TIER: ${{ inputs.tier }}
        MACOS: ${{ github.event_name == 'schedule' || inputs.macos }}
      run: python3 tools/check.py --plan "$TIER" --macos "$MACOS" | tee -a "$GITHUB_OUTPUT"
    defaults:
      run:
        working-directory: codecs/libjxl-rs
  static:
    name: 'JXL: Static checks (${{ matrix.os }})'
    # The static stage belongs to the nightly tier (and runs per change in
    # the codec job of ci.yml); the deep tier adds nothing to it.
    if: inputs.tier != 'deep'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || inputs.macos)
          && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libjxl-rs/.github/actions/prepare
      with:
        msrv: true
        oracle: false
    - name: Install the x86-64 target for the attribute-context check
      # tools/check.py builds three examples for x86-64 and inspects their
      # code (port ADR 0004); on an ARM64 Mac that is a cross build, and the
      # hosted image carries only the host's target.
      if: runner.os == 'macOS'
      run: rustup target add x86_64-apple-darwin
    - name: Check pins, notices, links, formatting, Clippy, MSRV, and release builds
      run: python3 tools/check.py --stage static --msrv
    defaults:
      run:
        working-directory: codecs/libjxl-rs
  toolchain:
    name: 'JXL: Tests at rust-version (ubuntu-24.04-arm, simd_vardct_lanes8)'
    # The per-change rust-version part on ARM64 (ci.yml) leaves out the
    # AArch64-only simd_vardct_lanes8 binary, which alone takes 11.5 minutes
    # to compile at Rust 1.94 (CI run 44176391504); the nightly tier runs it
    # there. cargo fails if the binary no longer exists.
    if: inputs.tier != 'deep'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libjxl-rs/.github/actions/prepare
      with:
        msrv: true
        oracle: false
    - name: Test simd_vardct_lanes8 at the port's rust-version
      run: |
        msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
        CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/rust-$msrv" \
          cargo +"$msrv" test --locked --offline -p ferrisma-libjxl --profile checked --test simd_vardct_lanes8
    defaults:
      run:
        working-directory: codecs/libjxl-rs
  tsan:
    name: 'JXL: ThreadSanitizer (ubuntu-latest, parallel runner & decoder)'
    # Exercises libjxl-rs's ThreadParallelRunner / ResizableParallelRunner,
    # concurrent AC/DC group decode and render (`simd_threads`), and
    # `ferrisma-jxl-decoder`'s multithreaded `decode_into_with_threads` and
    # `decode_region_into_with_threads` under Rust's ThreadSanitizer (issue #100).
    if: inputs.tier != 'deep'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libjxl-rs/.github/actions/prepare
    - name: Install rust-src for ThreadSanitizer std build
      run: |
        nightly="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        rustup component add --toolchain "$nightly" rust-src
    - name: Build the scalar and SIMD oracles for simd_threads
      working-directory: codecs/libjxl-rs
      run: python3 tools/check.py --stage oracle
    - name: Run ThreadSanitizer on ferrisma-jxl-decoder and libjxl-rs runner suites
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target/tsan
        RUSTFLAGS: -Z sanitizer=thread
        JXL_CPP_ORACLE: ${{ github.workspace }}/codecs/libjxl-rs/target/oracle/jxl_oracle
        JXL_CPP_ORACLE_SIMD: ${{ github.workspace }}/codecs/libjxl-rs/target/oracle-avx2/jxl_oracle
      run: |
        nightly="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        cargo +"$nightly" test --target x86_64-unknown-linux-gnu -Z build-std \
          -p ferrisma-jxl-decoder --lib
        cargo +"$nightly" test --target x86_64-unknown-linux-gnu -Z build-std \
          -p ferrisma-libjxl --lib thread_parallel_runner_internal
        cargo +"$nightly" test --target x86_64-unknown-linux-gnu -Z build-std \
          -p ferrisma-libjxl --test thread_runners --test dispatch_scope
        cargo +"$nightly" test --target x86_64-unknown-linux-gnu -Z build-std \
          -p ferrisma-libjxl --features cpp-oracle-simd --test simd_threads
  parity:
    name: 'JXL: Tests (${{ matrix.os }}, ${{ matrix.oracle }} oracle, ${{ matrix.tier }} ${{ matrix.shard }}/${{ matrix.shards
      }})'
    needs: plan
    strategy:
      fail-fast: false
      # The shards per runner and oracle are in tools/check.py (CI_PARITY):
      # sized so that each nightly job stays within 60 minutes, with enough
      # of them at once to keep the tier's wall time within three hours.
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.parity) }}
    runs-on: ${{ matrix.os }}
    # A hung test otherwise holds the shard until GitHub's 360-minute job
    # limit (issue #119). The nightly budget is 60 minutes per job; the
    # timeout is the hang guard above it, so that a slow runner still
    # reports its time. Deep jobs may use the hosted limit.
    timeout-minutes: ${{ inputs.tier == 'deep' && 330 || 90 }}
    env:
      PARTITION: ${{ matrix.shard }}/${{ matrix.shards }}
      SHARD: ${{ matrix.shard }}
      TIER: ${{ matrix.tier }}
      GROUP: ${{ matrix.group }}
      ORACLE_FLAGS: ${{ matrix.oracle == 'sanitized' && '--sanitizers' || '' }}
      ORACLE_GRAPH: ${{ matrix.oracle == 'sanitized' && 'oracle-asan' || 'oracle' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libjxl-rs/.github/actions/prepare
    - name: Identify the oracle build inputs
      id: inputs
      run: |
        {
          git rev-parse HEAD:./upstream/libjxl
          "$CXX" --version
          if command -v dpkg-query >/dev/null; then dpkg-query -W 'libc++*'; fi
          echo "$ImageOS $ImageVersion"
        } | tee "$RUNNER_TEMP/oracle-toolchain.txt"
        echo "toolchain=$(shasum -a 256 "$RUNNER_TEMP/oracle-toolchain.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Restore the oracle build
      id: restore
      if: github.event_name == 'pull_request' || github.event_name == 'push'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key: oracle-${{ runner.os }}-${{ runner.arch }}-${{ matrix.oracle }}-${{ steps.inputs.outputs.toolchain
          }}-${{ hashFiles('codecs/libjxl-rs/upstream.json', 'codecs/libjxl-rs/tools/oracle/**', 'codecs/libjxl-rs/tools/*.py')
          }}
        path: |
          codecs/libjxl-rs/target/${{ env.ORACLE_GRAPH }}
          codecs/libjxl-rs/target/brotli-support/${{ matrix.oracle }}
          !codecs/libjxl-rs/target/brotli-support/${{ matrix.oracle }}/captures
    - name: Date the checkout before the restored build
      if: steps.restore.outputs.cache-hit == 'true'
      run: find upstream/libjxl tools -name .git -prune -o -type f -exec touch -t 200001010000 {} +
    - name: Build the oracle
      run: python3 tools/check.py --stage oracle $ORACLE_FLAGS
    - name: Initialize the pinned testdata for the photographs
      # The deep tier compares photographs of upstream's pinned testdata
      # (tests/data/photographs); check.py verifies them against their record.
      if: matrix.tier == 'deep'
      run: git -C upstream/libjxl submodule update --init --depth 1 testdata
    - name: Save the oracle build
      if: steps.restore.outputs.cache-hit != 'true' && (github.event_name == 'pull_request' || github.event_name
        == 'push')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key: oracle-${{ runner.os }}-${{ runner.arch }}-${{ matrix.oracle }}-${{ steps.inputs.outputs.toolchain
          }}-${{ hashFiles('codecs/libjxl-rs/upstream.json', 'codecs/libjxl-rs/tools/oracle/**', 'codecs/libjxl-rs/tools/*.py')
          }}
        path: |
          codecs/libjxl-rs/target/${{ env.ORACLE_GRAPH }}
          codecs/libjxl-rs/target/brotli-support/${{ matrix.oracle }}
          !codecs/libjxl-rs/target/brotli-support/${{ matrix.oracle }}/captures
    - name: Run the checked-profile tests
      # On Linux the step also reports the job's peak memory use (MemTotal
      # minus MemAvailable, sampled every 5 s) and the largest single
      # process (GNU time), since the gate tests run their references
      # concurrently.
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          ( peak=0; while sleep 5; do
              used=$(awk '/^MemTotal/ {t=$2} /^MemAvailable/ {a=$2} END {print int((t-a)/1024)}' /proc/meminfo)
              [ "$used" -gt "$peak" ] && peak=$used && echo "$peak" > "$RUNNER_TEMP/peak-mib"
            done ) &
          sampler=$!
          status=0
          timer=()
          [ -x /usr/bin/time ] && timer=(/usr/bin/time -v -o "$RUNNER_TEMP/time.txt")
          "${timer[@]}" python3 tools/check.py --stage test --partition "$PARTITION" --tier "$TIER" \
            --record "$RUNNER_TEMP/selection/$GROUP-$SHARD.json" --record-group "$GROUP" $ORACLE_FLAGS || status=$?
          kill "$sampler" || true
          echo "Peak memory in use: $(cat "$RUNNER_TEMP/peak-mib" 2>/dev/null) MiB of $(awk '/^MemTotal/ {print int($2/1024)}' /proc/meminfo) MiB"
          grep 'Maximum resident set size' "$RUNNER_TEMP/time.txt" 2>/dev/null || true
          exit "$status"
        fi
        python3 tools/check.py --stage test --partition "$PARTITION" --tier "$TIER" \
          --record "$RUNNER_TEMP/selection/$GROUP-$SHARD.json" --record-group "$GROUP" $ORACLE_FLAGS
    - name: Keep the selection record
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-selection-${{ matrix.group }}-${{ matrix.shard }}-of-${{ matrix.shards }}
        path: ${{ runner.temp }}/selection
        if-no-files-found: error
        retention-days: 7
    defaults:
      run:
        working-directory: codecs/libjxl-rs
  selection:
    name: 'JXL: Every test of the ${{ inputs.tier }} tier ran'
    needs: parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: jxl-selection-*
        path: ${{ runner.temp }}/selection
        merge-multiple: true
    - name: Require one record per planned shard and the whole tier in their union
      env:
        TIER: ${{ inputs.tier }}
        MACOS: ${{ github.event_name == 'schedule' || inputs.macos }}
      run: python3 tools/check.py --plan "$TIER" --macos "$MACOS" --verify-records "$RUNNER_TEMP/selection"
    defaults:
      run:
        working-directory: codecs/libjxl-rs
  capture:
    name: 'JXL: Capture the audit requests (${{ matrix.os }}, ${{ matrix.oracle }} oracle)'
    # The decoder and public-decoder audits replay request corpora that the
    # parity tests capture with each original graph (default_cms::,
    # decoder_public::). The captures run here, one job per graph, so that
    # the audit jobs stay within the nightly budget: with both captures the
    # public-decoder audit took 53 and 78 minutes and the decoder audit 42
    # and 57 on ubuntu-latest (runs 44171290082 and 44230182686).
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.capture) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.tier == 'deep' && 330 || 90 }}
    env:
      ORACLE_FLAGS: ${{ matrix.oracle == 'sanitized' && '--sanitizers' || '' }}
      ORACLE_GRAPH: ${{ matrix.oracle == 'sanitized' && 'oracle-asan' || 'oracle' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libjxl-rs/.github/actions/prepare
    - name: Capture the default CMS and public decoder parity requests
      run: |
        python3 tools/check.py --stage test --filter "default_cms::" $ORACLE_FLAGS
        python3 tools/check.py --stage test --filter "decoder_public::" $ORACLE_FLAGS
    - name: Keep the captured corpora
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-audit-corpora-${{ matrix.os }}-${{ matrix.oracle }}
        path: |
          codecs/libjxl-rs/target/${{ env.ORACLE_GRAPH }}/default-cms-corpus
          codecs/libjxl-rs/target/${{ env.ORACLE_GRAPH }}/decoder-public-corpus
        if-no-files-found: error
        retention-days: 7
    defaults:
      run:
        working-directory: codecs/libjxl-rs
  audit:
    name: 'JXL: Audit (${{ matrix.os }}, ${{ matrix.group }})'
    needs:
    - plan
    - capture
    strategy:
      fail-fast: false
      # The groups per tier are in tools/check.py (CI_AUDIT): the macOS
      # decoder and public-decoder audits run in the deep tier.
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.audit) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.tier == 'deep' && 330 || 90 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./codecs/libjxl-rs/.github/actions/prepare
      with:
        msrv: true
    - name: Build the ordinary and instrumented oracles
      run: |
        python3 tools/check.py --stage oracle
        python3 tools/check.py --stage oracle --sanitizers
    - name: Restore the captured requests of the ordinary graph
      if: matrix.group == 'decoder' || matrix.group == 'public-decoder'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: jxl-audit-corpora-${{ matrix.os }}-ordinary
        path: codecs/libjxl-rs/target/oracle
    - name: Restore the captured requests of the instrumented graph
      if: matrix.group == 'decoder' || matrix.group == 'public-decoder'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: jxl-audit-corpora-${{ matrix.os }}-sanitized
        path: codecs/libjxl-rs/target/oracle-asan
    - name: Audit the decoder numeric reference configurations
      if: matrix.group == 'decoder'
      run: |
        python3 tools/epf_reference.py
        python3 tools/noise_reference.py
        python3 tools/alpha_reference.py
        python3 tools/decoder_api_reference.py --output target/decoder-api-acceptance
        python3 tools/skcms_reference.py --output target/skcms-acceptance
        python3 tools/skcms_fitting_reference.py --output target/skcms-fitting-acceptance
        python3 tools/skcms_transform_reference.py --output target/skcms-transform-acceptance
        python3 tools/default_cms_reference.py --output target/default-cms-acceptance
    - name: Audit complete chroma images and retained frame lifecycles
      if: ${{ !cancelled() && matrix.group == 'decoder' }}
      run: |
        python3 tools/chroma_reference.py --audit --output target/chroma-acceptance
        python3 tools/chroma_image_reference.py --output target/chroma-image-acceptance
        python3 tools/frame_sequences.py --output target/lifecycle-acceptance
        python3 tools/output_stage_reference.py --output target/output-stage-acceptance
    - name: Retain complete decoder source evidence
      if: ${{ !cancelled() && matrix.group == 'decoder' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-decoder-source-${{ matrix.os }}
        path: |
          codecs/libjxl-rs/target/chroma-acceptance
          !codecs/libjxl-rs/target/chroma-acceptance/**/jxl_oracle
          !codecs/libjxl-rs/target/chroma-acceptance/**/*.o
          codecs/libjxl-rs/target/chroma-image-acceptance
          codecs/libjxl-rs/target/lifecycle-acceptance
          codecs/libjxl-rs/target/output-stage-acceptance
          codecs/libjxl-rs/target/decoder-api-acceptance
          codecs/libjxl-rs/target/skcms-acceptance
          codecs/libjxl-rs/target/skcms-fitting-acceptance
          codecs/libjxl-rs/target/skcms-transform-acceptance
          codecs/libjxl-rs/target/default-cms-acceptance
        if-no-files-found: error
    - name: Audit complete extra-channel source bindings and stride boundaries
      if: matrix.group == 'extra-channels'
      run: python3 tools/extra_channels_reference.py --output target/extra-channels-reference
    - name: Retain complete extra-channel source evidence
      if: ${{ !cancelled() && matrix.group == 'extra-channels' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-extra-channels-reference-${{ runner.os }}
        path: codecs/libjxl-rs/target/extra-channels-reference
        if-no-files-found: error
        retention-days: 7
    - name: Audit complete geometry source bindings and independent output captures
      if: matrix.group == 'geometry'
      run: python3 tools/decoder_geometry_reference.py --output target/decoder-geometry-reference
    - name: Retain complete geometry source evidence
      if: ${{ !cancelled() && matrix.group == 'geometry' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-decoder-geometry-reference-${{ runner.os }}
        path: codecs/libjxl-rs/target/decoder-geometry-reference
        if-no-files-found: error
    - name: Audit integrated ICC reader, parser, and JPEG metadata
      if: matrix.group == 'components'
      run: |
        python3 tools/icc_reader_reference.py --output target/icc-reader-acceptance
        python3 tools/skcms_parser_reference.py --output target/skcms-parser-acceptance
        python3 tools/jpeg_metadata_reference.py --output target/jpeg-metadata-acceptance
    - name: Audit the encoder transform contraction map
      if: ${{ !cancelled() && matrix.group == 'components' }}
      run: python3 tools/encoder_transforms_contraction.py --output target/encoder-transforms-contraction
    - name: Audit the encoder heuristics contraction map
      if: ${{ !cancelled() && matrix.group == 'components' }}
      run: python3 tools/encoder_transforms_contraction.py --map tools/encoder_heuristics_contraction.json --output
        target/encoder-heuristics-contraction
    - name: Retain integrated component source evidence
      if: ${{ !cancelled() && matrix.group == 'components' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-integrated-components-${{ runner.os }}
        path: |
          codecs/libjxl-rs/target/icc-reader-acceptance
          codecs/libjxl-rs/target/skcms-parser-acceptance
          codecs/libjxl-rs/target/jpeg-metadata-acceptance
          codecs/libjxl-rs/target/encoder-transforms-contraction
          codecs/libjxl-rs/target/encoder-heuristics-contraction
        if-no-files-found: error
    - name: Audit complete Brotli streaming and API source boundaries
      if: matrix.group == 'brotli'
      run: |
        python3 tools/brotli_stream_reference.py --output target/brotli-stream-acceptance
        python3 tools/brotli_stream_api_reference.py --output target/brotli-stream-api-acceptance
    - name: Retain Brotli source acceptance
      if: ${{ !cancelled() && matrix.group == 'brotli' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-brotli-source-${{ runner.os }}
        path: |
          codecs/libjxl-rs/target/brotli-support/**/report.json
          codecs/libjxl-rs/target/brotli-stream-acceptance
          codecs/libjxl-rs/target/brotli-stream-api-acceptance
          !codecs/libjxl-rs/target/brotli-*-acceptance/**/*.o
          !codecs/libjxl-rs/target/brotli-*-acceptance/**/*.a
        if-no-files-found: error
        retention-days: 7
    - name: Audit recovered input, box, and JPEG reconstruction boundaries
      if: matrix.group == 'decoder-state'
      run: |
        python3 tools/jpeg_payload_reference.py --output target/jpeg-payload-acceptance
        python3 tools/decoder_input_reference.py --output target/decoder-input-acceptance
        python3 tools/box_content_decoder_reference.py --output target/box-content-acceptance
        python3 tools/jpeg_reconstruction_reference.py --output target/jpeg-reconstruction-reference
    - name: Retain recovered decoder source evidence
      if: ${{ !cancelled() && matrix.group == 'decoder-state' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-recovered-decoder-${{ runner.os }}
        path: |
          codecs/libjxl-rs/target/jpeg-payload-acceptance
          codecs/libjxl-rs/target/decoder-input-acceptance
          codecs/libjxl-rs/target/box-content-acceptance
          codecs/libjxl-rs/target/jpeg-reconstruction-reference
        if-no-files-found: error
        retention-days: 7
    - name: Audit the public decoder against the original public C API
      if: matrix.group == 'public-decoder'
      run: python3 tools/decoder_public_reference.py --output target/decoder-public-acceptance
    - name: Retain public decoder source evidence
      if: ${{ !cancelled() && matrix.group == 'public-decoder' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-decoder-public-${{ runner.os }}
        path: |
          codecs/libjxl-rs/target/decoder-public-acceptance
          !codecs/libjxl-rs/target/decoder-public-acceptance/**/build
        if-no-files-found: error
        retention-days: 7
    - name: Build the tested parity binaries
      if: matrix.group == 'diagnostics'
      run: |
        cargo test --locked --offline --profile checked --all-features --test parity --no-run
        cargo test --locked --offline --release --all-features --test parity --no-run
    - name: Record native Linux scalar diagnostics
      if: matrix.group == 'diagnostics'
      run: python3 tools/scalar_diagnostics.py
    - name: Record native alpha configuration diagnostics
      if: ${{ !cancelled() && matrix.group == 'diagnostics' }}
      run: python3 tools/alpha_diagnostics.py
    - name: Census every original patch-tree boundary
      if: ${{ !cancelled() && matrix.group == 'diagnostics' }}
      run: python3 tools/patches_boundaries.py
    - name: Retain native alpha diagnostic evidence
      if: ${{ !cancelled() && matrix.group == 'diagnostics' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: jxl-alpha-diagnostics-${{ runner.os }}
        path: |
          codecs/libjxl-rs/target/alpha-diagnostics.json
          codecs/libjxl-rs/target/patches-boundaries.json
        if-no-files-found: error
        retention-days: 7
    defaults:
      run:
        working-directory: codecs/libjxl-rs
  checks:
    name: 'JXL: Checks passed'
    if: always()
    needs:
    - plan
    - static
    - toolchain
    - tsan
    - parity
    - selection
    - capture
    - audit
    runs-on: ubuntu-latest
    steps:
    - name: Require every gate job to pass
      env:
        TIER: ${{ inputs.tier }}
        STATIC: ${{ needs.static.result }} ${{ needs.toolchain.result }} ${{ needs.tsan.result }}
        RESULTS: ${{ needs.plan.result }} ${{ needs.parity.result }} ${{ needs.selection.result }} ${{ needs.capture.result
          }} ${{ needs.audit.result }}
      run: |
        echo "Tier: $TIER; static checks, rust-version and TSan tests: $STATIC; plan, tests, selection, captures, audits: $RESULTS"
        case "$TIER" in
          nightly) [ "$STATIC" = "success success success" ] || exit 1 ;;
          deep) [ "$STATIC" = "skipped skipped skipped" ] || exit 1 ;;
          *) exit 1 ;;
        esac
        for result in $RESULTS; do [ "$result" = success ] || exit 1; done
  report:
    name: 'JXL: Report the nightly failure'
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result,
      'cancelled'))
    needs:
    - static
    - parity
    - audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Open or update the nightly failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TITLE: Nightly deep check failed
        BODY: |
          The nightly deep check failed on `main` at ${{ github.sha }}.

          - Static checks: ${{ needs.static.result }}
          - Tests: ${{ needs.parity.result }}
          - Audits: ${{ needs.audit.result }}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
          --jq "map(select(.title == env.TITLE)) | first | .number // empty")
        if [ -n "$number" ]; then
          gh issue comment "$number" --body "$BODY"
        else
          gh issue create --title "$TITLE" --body "$BODY"
        fi
