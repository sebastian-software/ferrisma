name: M2 Encoder Comparison (Linux)

# ADR-0024 on x86-64: `rav1e` against libavif-rs at matched SSIMULACRA2,
# with the method of docs/benchmarks/M2-libavif-backend.md. Target A comes
# from the `anchor` phase instead of the full Sharp comparison. The timing
# runs twice, with libavif-rs's run-time SIMD dispatch and with
# AOM_SIMD_CAPS_MASK=0, which selects its scalar AOM paths.
on:
  workflow_dispatch:
    inputs:
      image_set:
        description: "Corpus lane; beach regions use the full attributed 60 MP source"
        type: choice
        options: [dog, flower, default, beach, beach-24, beach-48]
        default: dog
      qualities:
        description: "Comma-separated rav1e anchor qualities"
        type: string
        default: "60,80"
      runs:
        description: "Samples per configuration"
        type: string
        default: "5"

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUT: ${{ github.workspace }}/bench-out
      BENCH_SHARP_NODE_MODULES: ${{ github.workspace }}/.sharp/node_modules
      COMPARE_LIBAVIF_DATA: ${{ github.workspace }}/codecs/libavif-rs/upstream/libavif/tests/data
      COMPARE_LIBJXL_DATA: ${{ github.workspace }}/codecs/libjxl-rs/tests/data/decode-test
      # The runner is idle apart from this job; the load rule only skips
      # the tail of the build.
      COMPARE_MAX_LOAD: "6"
      COMPARE_IMAGE_SET: ${{ inputs.image_set }}
      COMPARE_ENCODER_LEVELS: ${{ inputs.qualities }}
      COMPARE_RUNS: ${{ inputs.runs }}
      COMPARE_LARGE_CORPUS: ${{ runner.temp }}/ferrixel-large-corpus
    steps:
      - uses: actions/checkout@v4
      - name: Activate the root toolchain
        run: rustup show active-toolchain
      - name: Install AV1 assembler
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Sharp for the corpus and references
        run: npm install --prefix "$GITHUB_WORKSPACE/.sharp" --no-audit --no-fund sharp@0.34.5
      - name: Record the runner CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nproc
          grep -m1 -o -w -E 'avx2|avx512f' /proc/cpuinfo | sort -u
      - name: Fetch the attributed large photograph
        if: startsWith(inputs.image_set, 'beach')
        run: |
          mkdir -p "$COMPARE_LARGE_CORPUS"
          curl --fail --location --max-filesize 14000000 \
            'https://upload.wikimedia.org/wikipedia/commons/e/e9/Beach_volleyball_sunset_%2853458847235%29.jpg' \
            -o "$COMPARE_LARGE_CORPUS/ferrixel-beach-volleyball-53458847235.jpg"
          node scripts/bench/corpus.cjs scripts/bench/corpus-large.json "$COMPARE_LARGE_CORPUS"
      - name: Prepare corpus and references
        run: python3 -I scripts/bench/compare-sharp.py prepare "$OUT"
      - name: Match each encoder thread configuration
        run: scripts/bench/compare-encoders.sh "$OUT" match
      - name: Time with libavif-rs SIMD dispatch
        env:
          COMPARE_ENCODER_RUN_ID: simd
        run: |
          scripts/bench/compare-encoders.sh "$OUT" time
      - name: Time with libavif-rs scalar AOM
        env:
          AOM_SIMD_CAPS_MASK: "0"
          COMPARE_ENCODER_RUN_ID: scalar
        run: |
          scripts/bench/compare-encoders.sh "$OUT" time
      - name: Attach results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-encoders-linux
          path: |
            bench-out/refs/*.ref
            bench-out/encoders/
            scripts/bench/corpus.json
            scripts/bench/corpus-large.json
            docs/benchmarks/corpus-and-comparison.md
            docs/benchmarks/encoder-adoption.md
          if-no-files-found: ignore
