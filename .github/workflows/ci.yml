name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.scope.outputs.engine }}
      kernels: ${{ steps.scope.outputs.kernels }}
      adapter: ${{ steps.scope.outputs.adapter }}
      workspace: ${{ steps.scope.outputs.workspace }}
      has-codecs: ${{ steps.scope.outputs.has-codecs }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: cargo fetch --locked
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            cargo xtask affected --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BASE" ] && ! [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            cargo xtask affected --base "$PUSH_BASE" --head "$PUSH_HEAD" --output "$GITHUB_OUTPUT"
          else
            cargo xtask affected --all --output "$GITHUB_OUTPUT"
          fi
  rust:
    needs: affected
    if: needs.affected.outputs.engine == 'true' || needs.affected.outputs.kernels == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: core-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            core-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo test -p ferrisma-xtask --locked
      - run: cargo clippy -p ferrisma-xtask --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check benchmark evidence contracts without codecs or timing
        run: |
          python3 -I scripts/bench/test_compare_sharp.py
          node --test scripts/bench/corpus.test.cjs
      - run: cargo test -p ferrisma -p ferrisma-kernels --all-targets
      - run: cargo test -p ferrisma --lib --no-default-features --features jpeg-read backend_only_tests
      - run: cargo test -p ferrisma --lib --no-default-features --features webp-read,webp-write webp_output_tests
      - run: cargo test -p ferrisma -p ferrisma-kernels --all-targets --all-features
      - run: cargo test -p ferrisma-jxl-decoder -p ferrisma-avif-read -p ferrisma-avif-write --lib --locked
      # Codec dependencies retain their separate strict stable-Clippy jobs.
      - run: cargo clippy -p ferrisma -p ferrisma-kernels --all-targets --no-deps -- -D warnings
      - run: cargo clippy -p ferrisma -p ferrisma-kernels --all-targets --all-features --no-deps -- -D warnings
      - run: cargo clippy -p ferrisma-jxl-decoder -p ferrisma-avif-read -p ferrisma-avif-write --all-targets --no-deps --locked -- -D warnings
      - run: |
          for feature in jpeg-read webp-read webp-write jpeg-xl-read jpeg-xl-own-read avif-read avif-write avif-own-write icc cli; do
            cargo check --no-default-features --features "$feature"
          done
      - name: Check license inventory contracts and dependency metadata
        run: |
          python3 -I scripts/test_audit_licenses.py
          python3 -I scripts/test_production_license_bundle.py
          python3 -I scripts/audit-licenses.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-license-metadata
          path: target/m1-license-inventory.csv
          if-no-files-found: ignore
  minimum-rust:
    needs: affected
    if: needs.affected.outputs.engine == 'true' || needs.affected.outputs.kernels == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore minimum-rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: core-minimum-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            core-minimum-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - run: cargo +1.98.0 fetch --locked
      # Own AVIF input/output use the native nightly port; the remaining engine features
      # keep the stable MSRV contract. Native reader jobs cover AVIF separately.
      - run: cargo +1.98.0 check -p ferrisma -p ferrisma-kernels --features jpeg-read,webp-read,webp-write,jpeg-xl-read,jpeg-xl-own-read,avif-write,icc --locked
      - run: cargo +1.98.0 check -p ferrisma-xtask --all-targets --locked
  kernels-arm:
    needs: affected
    if: needs.affected.outputs.kernels == 'true' || needs.affected.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore kernels-arm build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: core-kernels-arm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            core-kernels-arm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - run: cargo fetch --locked
      - run: cargo run -p ferrisma-kernels --example detect
      - run: cargo test -p ferrisma -p ferrisma-kernels --all-targets
      - run: cargo clippy -p ferrisma-kernels --all-targets -- -D warnings
  native-adapters:
    needs: affected
    if: needs.affected.outputs.engine == 'true' || needs.affected.outputs.adapter == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore native adapter build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: core-native-readers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            core-native-readers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - run: test "$(uname -m)" = arm64
      - run: cargo fetch --locked
      # Selecting these consumers together also checks that AVIF input and the
      # libavif encoder link in the same binary without duplicate dav1d symbols.
      - run: cargo test -p ferrisma -p ferrisma-avif-read -p ferrisma-avif-write -p ferrisma-jxl-decoder -p ferrisma-libavif --all-targets --all-features --locked
      - run: cargo clippy -p ferrisma -p ferrisma-avif-read -p ferrisma-avif-write -p ferrisma-jxl-decoder -p ferrisma-libavif --all-targets --all-features --no-deps --locked -- -D warnings
      - name: Verify concurrent SharpYUV cold initialization on ARM64
        run: |
          cargo test -p libavif-sharpyuv --test cross_port_cold_threads --profile checked --locked
          cargo test -p libavif-sharpyuv --test cross_port_cold_threads --release --locked
  workspace:
    needs: affected
    if: needs.affected.outputs.workspace == 'true' || needs.affected.outputs.adapter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore workspace build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: core-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            core-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
      - run: sudo apt-get update -qq && sudo apt-get install -y ninja-build pkg-config nasm
      - run: cargo fetch --locked
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p libavif-sharpyuv --test cross_port --test cross_port_cold_threads --profile checked --locked
      - run: cargo test -p libavif-sharpyuv --test cross_port --test cross_port_cold_threads --release --locked
      - name: Check shared SharpYUV core on its stable toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal --component clippy
          cargo +1.95 check -p libsharpyuv-core --all-targets --locked
          cargo +1.95 clippy -p libsharpyuv-core --all-targets --no-deps --locked -- -D warnings
      - working-directory: crates/ferrisma-libavif
        run: |
          cargo clippy --release --all-features --all-targets --locked --no-deps -- -D warnings
          cargo test --release --all-features --locked
      - working-directory: codecs/libavif-rs
        run: |
          python3 tools/verify_upstream.py --tracked
          python3 tools/check_translation.py
          python3 tools/generate_licenses.py --check
          python3 -m unittest discover -s tests/ports -p '*_test.py'
  codecs:
    needs: affected
    if: needs.affected.outputs.has-codecs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Separate cache namespaces keep architectures and codec feature sets isolated.
      - name: Restore codec build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: codec-pr-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.codec }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'codecs/libjxl-rs/.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            codec-pr-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.codec }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'codecs/libjxl-rs/.cargo/config.toml') }}-
      - name: Initialize pinned codec references
        env:
          CODEC: ${{ matrix.codec }}
        run: |
          case "$CODEC" in
            jpeg) git submodule update --init codecs/libjpeg-turbo-rs/upstream/libjpeg-turbo ;;
            webp) git submodule update --init codecs/libwebp-rs/upstream/libwebp codecs/libwebp-rs/upstream/libwebp-test-data ;;
            jxl)
              git submodule update --init --depth 1 codecs/libjxl-rs/upstream/libjxl
              git -C codecs/libjxl-rs/upstream/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
              ;;
            avif) ;;
            *) exit 1 ;;
          esac
      - run: cargo fetch --locked
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup toolchain install 1.95 --profile minimal
      - env:
          CODEC: ${{ matrix.codec }}
          ARCH: ${{ runner.arch }}
        run: |
          if [ "$ARCH" = ARM64 ]; then
            cargo xtask codecs --codec "$CODEC" --stage pr --tests-only
          else
            cargo xtask codecs --codec "$CODEC" --stage pr
          fi
  checks-passed:
    name: Checks passed
    if: always()
    needs: [affected, rust, minimum-rust, kernels-arm, native-adapters, workspace, codecs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DETECTOR: ${{ needs.affected.result }}
      CORE: ${{ needs.affected.outputs.engine == 'true' || needs.affected.outputs.kernels == 'true' }}
      WORKSPACE: ${{ needs.affected.outputs.workspace == 'true' || needs.affected.outputs.adapter == 'true' }}
      CODECS: ${{ needs.affected.outputs.has-codecs }}
      READERS: ${{ needs.affected.outputs.engine == 'true' || needs.affected.outputs.adapter == 'true' }}
      RUST: ${{ needs.rust.result }}
      MSRV: ${{ needs.minimum-rust.result }}
      ARM: ${{ needs.kernels-arm.result }}
      INTEGRATION: ${{ needs.workspace.result }}
      NATIVE: ${{ needs.native-adapters.result }}
      CODEC_RESULT: ${{ needs.codecs.result }}
    steps:
      - run: |
          [ "$DETECTOR" = success ] || exit 1
          check() { if [ "$1" = true ]; then [ "$2" = success ]; else [ "$2" = skipped ]; fi; }
          check "$CORE" "$RUST" && check "$CORE" "$MSRV" && check "$CORE" "$ARM" && check "$READERS" "$NATIVE" && check "$WORKSPACE" "$INTEGRATION" && check "$CODECS" "$CODEC_RESULT"
