name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install AV1 assembler for optional rav1d backend
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Format
        run: cargo fmt --all --check
      - name: Report SIMD kernel levels exercised on this runner
        run: cargo run -p ferrixel-kernels --example detect
      - name: Kernel throughput per level (informational)
        run: cargo run --release -p ferrixel-kernels --example bench
      - name: Test core and kernels without codecs
        run: cargo test --workspace --all-targets
      - name: Test with optional codecs
        run: cargo test --workspace --all-targets --all-features
      - name: Lint core without codecs
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint with optional codecs
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check individually enabled features
        run: |
          for feature in jpeg-read jpeg-xl-read avif-read avif-write icc cli; do
            cargo check --no-default-features --features "$feature"
          done
      - name: Verify license metadata expression policy
        run: python3 scripts/test_audit_licenses.py
      - name: Screen transitive license metadata
        run: python3 scripts/audit-licenses.py
      - name: Attach the resolved dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-license-metadata
          path: target/m1-license-inventory.csv
          if-no-files-found: ignore

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install AV1 assembler
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Check all feature combinations on declared MSRV
        run: cargo check --workspace --all-features

  # NEON kernels on Linux Arm (and SVE2 detection where the runner has it).
  kernels-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Report SIMD kernel levels exercised on this runner
        run: cargo run -p ferrixel-kernels --example detect
      - name: Kernel throughput per level (informational)
        run: cargo run --release -p ferrixel-kernels --example bench
      - name: Test core and kernels without codecs
        run: cargo test --workspace --all-targets
      - name: Lint kernels
        run: cargo clippy -p ferrixel-kernels --all-targets -- -D warnings

  # libavif-rs encoder adapter (ADR-0024): outside the workspace, on the
  # nightly that libavif-rs pins, with libvmaf through pkg-config. libavif-rs
  # builds on aarch64 macOS and x86-64 GNU Linux.
  libavif-backend:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/ferrixel-libavif
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install libvmaf and pkg-config
        run: brew install libvmaf pkgconf
      - name: Install the pinned nightly from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release --all-features --all-targets --locked -- -D warnings
      - name: Test (decodes with libavif-rs's own decoder)
        run: cargo test --release --all-features --locked

  # The same adapter on x86-64 GNU Linux. Ubuntu packages an older libvmaf,
  # so the job builds the libvmaf 3.2.1 that libavif-rs pins, with the
  # options of libavif-rs's `tools/build_aom_vmaf.py` (Meson 1.7.2, static,
  # no assembly), and caches it.
  libavif-backend-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/ferrixel-libavif
    env:
      VMAF_PREFIX: ${{ github.workspace }}/.vmaf/install
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build pkg-config
      - name: Cache libvmaf 3.2.1
        id: vmaf-cache
        uses: actions/cache@v4
        with:
          path: .vmaf/install
          key: libvmaf-v3.2.1-f85a853-meson-1.7.2-static-noasm-${{ runner.os }}-${{ runner.arch }}
      - name: Build libvmaf 3.2.1
        if: steps.vmaf-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          python3 -m venv .vmaf/venv
          .vmaf/venv/bin/pip install --quiet meson==1.7.2
          git clone --quiet --depth=1 --branch v3.2.1 https://github.com/Netflix/vmaf.git .vmaf/src
          test "$(git -C .vmaf/src rev-parse HEAD)" = f85a853692a8c730d0270cd733c8bb30b5b93b7c
          .vmaf/venv/bin/meson setup .vmaf/build .vmaf/src/libvmaf --buildtype=release \
            --prefix "$VMAF_PREFIX" --libdir=lib -Ddefault_library=static -Denable_asm=false \
            -Denable_tests=false -Denable_docs=false -Denable_tools=false \
            -Dbuilt_in_models=true -Denable_float=true
          ninja -C .vmaf/build install
      - name: Point pkg-config at libvmaf
        run: |
          echo "PKG_CONFIG_PATH=$VMAF_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$VMAF_PREFIX/lib/pkgconfig" pkg-config --modversion libvmaf
      - name: Install the pinned nightly from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lint
        run: cargo clippy --release --all-features --all-targets --locked -- -D warnings
      - name: Test (decodes with libavif-rs's own decoder)
        run: cargo test --release --all-features --locked
