name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install AV1 assembler for optional rav1d backend
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Format
        run: cargo fmt --all --check
      - name: Report SIMD kernel levels exercised on this runner
        run: cargo run -p ferrixel-kernels --example detect
      - name: Kernel throughput per level (informational)
        run: cargo run --release -p ferrixel-kernels --example bench
      - name: Test core and kernels without codecs
        run: cargo test --workspace --all-targets
      - name: Test with optional codecs
        run: cargo test --workspace --all-targets --all-features
      - name: Lint core without codecs
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint with optional codecs
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check individually enabled features
        run: |
          for feature in jpeg-read jpeg-xl-read avif-read avif-write icc cli; do
            cargo check --no-default-features --features "$feature"
          done
      - name: Verify license metadata expression policy
        run: python3 scripts/test_audit_licenses.py
      - name: Screen transitive license metadata
        run: python3 scripts/audit-licenses.py
      - name: Attach the resolved dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-license-metadata
          path: target/m1-license-inventory.csv
          if-no-files-found: ignore

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install AV1 assembler
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Check all feature combinations on declared MSRV
        run: cargo check --workspace --all-features

  # NEON kernels on Linux Arm (and SVE2 detection where the runner has it).
  kernels-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Report SIMD kernel levels exercised on this runner
        run: cargo run -p ferrixel-kernels --example detect
      - name: Kernel throughput per level (informational)
        run: cargo run --release -p ferrixel-kernels --example bench
      - name: Test core and kernels without codecs
        run: cargo test --workspace --all-targets
      - name: Lint kernels
        run: cargo clippy -p ferrixel-kernels --all-targets -- -D warnings

  # libavif-rs encoder adapter (ADR-0024): outside the workspace, on the
  # nightly that libavif-rs pins, with libvmaf through pkg-config. libavif-rs
  # builds on aarch64 macOS and x86-64 GNU Linux; Linux needs libvmaf 3.2,
  # which Ubuntu does not package, so this job runs on macOS for now.
  libavif-backend:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates/ferrixel-libavif
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install libvmaf and pkg-config
        run: brew install libvmaf pkgconf
      - name: Install the pinned nightly from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release --all-features --all-targets --locked -- -D warnings
      - name: Test (decodes with libavif-rs's own decoder)
        run: cargo test --release --all-features --locked
