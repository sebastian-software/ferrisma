name: Checks

# Runs for every pull request and push to main, and on demand. Ordinary checks
# (upstream pin, module skeleton, links, formatting, Clippy, tests) run on Linux
# x86-64 and macOS ARM64; the MSRV job builds and tests on the rust-version
# toolchain; the oracle job builds the C oracle (ADR 0002) in its release and
# asan-ubsan variants on both systems, runs upstream's whole test suite against
# each as a check of the oracle itself, and runs the in-scope djpeg bit tests,
# the differential tests and the ISO/IEC 10918-2 conformance run against both
# (ITU's data is downloaded and verified by tools/fetch_t83.py and cached by
# its SHA-256, as it may not be redistributed); the SIMD job does the same
# with the simd oracle (WITH_SIMD=1) on the ARM64 hosts, with the Neon kernels
# (ADR 0007), and on Linux x86-64, with the AVX2 and SSE2 kernels (ADR 0008),
# in each SIMD mode of the architecture; the bench job measures the decode
# speed against libjpeg-turbo on native x86-64 and ARM64 and keeps the record.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # ADR 0002: the CI hosts build the oracle with Clang (Apple Clang on macOS).
  CC: clang

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Check the pin, skeleton, links, formatting, Clippy and tests
        run: python3 tools/check.py

  msrv:
    name: MSRV (Rust 1.95, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64 builds the SSE2 and AVX2 kernels, ARM64 the Neon kernels.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test with the rust-version toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 test --locked

  oracle:
    name: Oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Build the release and asan-ubsan oracles
        run: python3 tools/build_oracle.py --variant reference
      - name: Restore the ISO/IEC 10918-2 compliance data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/t83/T83_data_files.zip
          key: t83-9f5ed0a74a3087c6c93f4cbb0bd5128c2a87b128e4f59f5b6649e32941da7069
      - name: Fetch and verify the compliance data
        run: python3 tools/fetch_t83.py
      - name: Upstream's whole test suite against both oracles
        run: |
          python3 tools/bittests.py --run --all --variant release --jobs 4
          python3 tools/bittests.py --run --all --variant asan-ubsan --jobs 4
      - name: In-scope bit tests and differential tests against the release oracle
        run: python3 tools/check.py --stage test --oracle-variant release
      - name: In-scope bit tests and differential tests against the asan-ubsan oracle
        run: python3 tools/check.py --stage test --oracle-variant asan-ubsan
      - name: Keep the oracle records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-${{ matrix.os }}
          path: |
            build/oracle/*/oracle.json
            build/oracle/*/bittests-result.json
            build/t83/t83.json
          if-no-files-found: error
          retention-days: 30

  simd:
    name: SIMD oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install NASM for the x86-64 SIMD extensions
        if: runner.arch == 'X64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
      - name: Build the simd oracle
        run: python3 tools/build_oracle.py --variant simd
      - name: Restore the ISO/IEC 10918-2 compliance data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/t83/T83_data_files.zip
          key: t83-9f5ed0a74a3087c6c93f4cbb0bd5128c2a87b128e4f59f5b6649e32941da7069
      - name: Fetch and verify the compliance data
        run: python3 tools/fetch_t83.py
      - name: Upstream's whole test suite against the simd oracle
        run: python3 tools/bittests.py --run --all --variant simd --jobs 4
      - name: In-scope bit tests and differential tests in each SIMD mode
        run: python3 tools/check.py --stage test --oracle-variant simd
      - name: Keep the oracle records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-simd-${{ matrix.os }}
          path: |
            build/oracle/*/oracle.json
            build/oracle/*/bittests-result.json
            build/t83/t83.json
          if-no-files-found: error
          retention-days: 30

  bench:
    name: Bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install NASM for the x86-64 SIMD extensions
        if: runner.arch == 'X64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
      - name: Measure the decode speed against libjpeg-turbo
        run: python3 tools/bench.py
      - name: Keep the record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.os }}
          path: build/bench/results.json
          if-no-files-found: error
          retention-days: 30

  # The single required status check: any failed or cancelled job fails it.
  checks-passed:
    name: Checks passed
    if: always()
    needs: [checks, msrv, oracle, simd, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;;
          esac
