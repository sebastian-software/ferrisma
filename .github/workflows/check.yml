name: Checks

# Runs for every pull request and push to main, and on demand. Ordinary checks
# (upstream pin, module skeleton, links, formatting, Clippy, tests) run on Linux
# x86-64 and macOS ARM64; the MSRV job builds and tests on the rust-version
# toolchain; the oracle job builds the C oracle (ADR 0002) in its release and
# asan-ubsan variants on both systems, runs upstream's whole test suite against
# each as a check of the oracle itself, and runs the in-scope djpeg bit tests
# and the differential tests against both.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # ADR 0002: the CI hosts build the oracle with Clang (Apple Clang on macOS).
  CC: clang

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Check the pin, skeleton, links, formatting, Clippy and tests
        run: python3 tools/check.py

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test with the rust-version toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 test --locked

  oracle:
    name: Oracle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Build the release and asan-ubsan oracles
        run: python3 tools/build_oracle.py --variant reference
      - name: Upstream's whole test suite against both oracles
        run: |
          python3 tools/bittests.py --run --all --variant release --jobs 4
          python3 tools/bittests.py --run --all --variant asan-ubsan --jobs 4
      - name: In-scope bit tests and differential tests against the release oracle
        run: python3 tools/check.py --stage test --oracle-variant release
      - name: In-scope bit tests and differential tests against the asan-ubsan oracle
        run: python3 tools/check.py --stage test --oracle-variant asan-ubsan
      - name: Keep the oracle records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-${{ matrix.os }}
          path: |
            build/oracle/*/oracle.json
            build/oracle/*/bittests-result.json
          if-no-files-found: error
          retention-days: 30

  # The single required status check: any failed or cancelled job fails it.
  checks-passed:
    name: Checks passed
    if: always()
    needs: [checks, msrv, oracle]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;;
          esac
