name: Checks

on:
  push:
    branches: [main, feat/decoder-chroma]
  pull_request:

permissions:
  contents: read

jobs:
  port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize the pinned reference and codec dependencies
        run: |
          git submodule update --init --depth 1 upstream/libjxl
          git -C upstream/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
      - name: Install Rust toolchains
        run: rustup toolchain install stable 1.85 --profile minimal --component rustfmt --component clippy
      - name: Install the Linux reference standard library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Check the mechanical port
        run: python3 tools/check.py --sanitizers --msrv
      - name: Check the ordinary Linux reference
        if: always() && runner.os == 'Linux'
        run: python3 tools/check.py --msrv
      - name: Record native Linux scalar diagnostics
        if: always() && runner.os == 'Linux'
        run: python3 tools/scalar_diagnostics.py
      - name: Build the ordinary macOS reference for chroma acceptance
        if: always() && runner.os == 'macOS'
        run: |
          cmake -S tools/oracle -B target/oracle -DCMAKE_BUILD_TYPE=Release -DORACLE_SANITIZERS=OFF
          cmake --build target/oracle --target jxl_oracle --parallel 2
      - name: Audit the selected chroma reference configuration
        if: always()
        run: python3 tools/chroma_reference.py --audit --output target/chroma-acceptance
      - name: Preserve chroma acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chroma-acceptance-${{ matrix.os }}
          path: |
            target/chroma-acceptance
            !target/chroma-acceptance/**/jxl_oracle
            !target/chroma-acceptance/**/*.o
          if-no-files-found: error

      - name: Audit the EPF numeric reference configuration
        if: always() && runner.os == 'Linux'
        run: python3 tools/epf_reference.py
