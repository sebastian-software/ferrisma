name: Native Linux root profiles

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original C preprocessing and Rust compilation profile
        type: choice
        options: [both, release, debug]
        default: both
      variant:
        description: Original container configuration to generate
        type: choice
        options: [default, mini, extended-pixi, mini-extended-pixi]
        default: default
      tier:
        description: Preparation only, bounded original smoke suite, or complete original root suite
        type: choice
        options: [prepare, smoke, regression, full]
        default: prepare
  workflow_call:
    inputs:
      profile:
        type: string
        default: release
      variant:
        type: string
        default: default
      tier:
        type: string
        default: smoke

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CC: clang-16
      CXX: clang++-16
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-16
      LIBCLANG_PATH: /usr/lib/llvm-16/lib
      RUSTUP_TOOLCHAIN: nightly-2026-09-07
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned translation and reference prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 llvm-16-dev libclang-16-dev ninja-build pkg-config python3-venv cmake libpng-dev libjpeg-dev libxml2-dev
          rustup toolchain install nightly-2026-09-07 --profile minimal
          rustup toolchain install 1.80.1 --profile minimal
          cargo +1.80.1 install c2rust --version 0.21.0 --locked
          python3 -m venv build/root-tools
          build/root-tools/bin/python -m pip install meson==1.7.2
          echo "$GITHUB_WORKSPACE/build/root-tools/bin" >> "$GITHUB_PATH"
      - name: Verify source, provenance, and artifact guards
        run: |
          python3 tools/verify_upstream.py --tracked
          python3 tools/check_translation.py
          python3 tools/generate_licenses.py --check
          python3 tests/ports/root_profile_test.py
          python3 tests/ports/root_link_order_test.py
          python3 tests/ports/root_assertions_test.py
          cargo fetch --locked
      - name: Build the pinned retained VMAF reference
        run: |
          python3 tools/build_aom_vmaf.py --fetch
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/build/aom-vmaf-install/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build complete pinned original root references
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_VARIANT: ${{ inputs.variant }}
          REQUESTED_TIER: ${{ inputs.tier }}
        run: |
          python3 tools/root_pipeline.py --phase references --profile "$REQUESTED_PROFILE" \
            --variant "$REQUESTED_VARIANT" --tier "$REQUESTED_TIER" --jobs 2 \
            --clang-include /usr/lib/llvm-16/lib/clang/16/include
      - name: Generate and typecheck native root source profiles
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_VARIANT: ${{ inputs.variant }}
          REQUESTED_TIER: ${{ inputs.tier }}
        run: |
          python3 tools/root_pipeline.py --phase generate --profile "$REQUESTED_PROFILE" \
            --variant "$REQUESTED_VARIANT" --tier "$REQUESTED_TIER" --jobs 2 \
            --clang-include /usr/lib/llvm-16/lib/clang/16/include
      - name: Build unchanged original consumers against native Rust profiles
        if: inputs.tier != 'prepare'
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_VARIANT: ${{ inputs.variant }}
          REQUESTED_TIER: ${{ inputs.tier }}
        run: |
          python3 tools/root_pipeline.py --phase consumers --profile "$REQUESTED_PROFILE" \
            --variant "$REQUESTED_VARIANT" --tier "$REQUESTED_TIER" --jobs 2 \
            --clang-include /usr/lib/llvm-16/lib/clang/16/include
      - name: Run original C/Rust suites, ABI, ownership, and strict bytes
        if: inputs.tier != 'prepare'
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_VARIANT: ${{ inputs.variant }}
          REQUESTED_TIER: ${{ inputs.tier }}
        run: |
          python3 tools/root_pipeline.py --phase validate --profile "$REQUESTED_PROFILE" \
            --variant "$REQUESTED_VARIANT" --tier "$REQUESTED_TIER" --jobs 2 \
            --clang-include /usr/lib/llvm-16/lib/clang/16/include
      - name: Preserve generated source, exact C configuration, and typecheck evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: root-linux-${{ inputs.tier }}-${{ inputs.profile }}-${{ inputs.variant }}
          path: |
            src/profiles/linux/
            translations/root-linux-*.json
            build/root-translate-linux-*/
            build/root-c-linux-*/CMakeCache.txt
            build/root-c-linux-*/compile_commands.json
            build/root-c-linux-*/Testing/Temporary/
            build/root-c-linux-*-results.xml
            build/root-rust-linux-*/CMakeCache.txt
            build/root-rust-linux-*/compile_commands.json
            build/root-rust-linux-*/Testing/Temporary/
            build/root-rust-linux-*-results.xml
            build/root-rust-linux-*/aom-root-linkage.json
            build/root-rust-linux-*/**/*.map
            build/root-rust-linux-*/root-validation/
            build/abi-x86_64-unknown-linux-*/summary.json
            build/root-references-*/reference-profile.json
            build/root-references-*/dav1d/meson-logs/
            build/root-references-*/dav1d/config.h
            build/root-references-*/dav1d/compile_commands.json
            build/root-references-*/sharpyuv/CMakeCache.txt
            build/root-references-*/sharpyuv/CMakeFiles/CMakeConfigureLog.yaml
            build/root-references-*/sharpyuv/compile_commands.json
            build/root-references-*/sharpyuv/src/webp/config.h
            build/root-references-*/sharpyuv/scalar-macros.txt
            build/root-typecheck-*/summary.json
            build/aom-native-*/reference-profile.json
          if-no-files-found: error
          retention-days: 30
