name: Workspace integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Activate the root toolchain
        run: rustup show active-toolchain
      - name: Install the assembler used by the adapter's rav1e dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y nasm
      - name: Compile every workspace member in the default feature configuration
        run: cargo check --workspace --all-targets --locked
      - name: Compare the two SharpYUV ports with checked arithmetic
        run: cargo test -p libavif-sharpyuv --test cross_port --profile checked --locked
      - name: Compare the two SharpYUV ports in release
        run: cargo test -p libavif-sharpyuv --test cross_port --release --locked
      - name: Verify imported snapshots and generated translation hashes
        working-directory: codecs/libavif-rs
        run: |
          python3 tools/verify_upstream.py --tracked
          python3 tools/check_translation.py
          python3 tools/generate_licenses.py --check
          python3 -m unittest discover -s tests/ports -p '*_test.py'
