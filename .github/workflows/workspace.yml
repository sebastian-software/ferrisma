name: Workspace integration (manual macOS)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fetch --locked
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p libavif-sharpyuv --test cross_port --profile checked --locked
      - run: cargo test -p libavif-sharpyuv --test cross_port --release --locked
      - working-directory: crates/ferrisma-libavif
        run: |
          cargo clippy --release --all-features --all-targets --locked --no-deps -- -D warnings
          cargo test --release --all-features --locked
