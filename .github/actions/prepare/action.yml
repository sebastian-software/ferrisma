name: Prepare the port checks
description: Initialize the pinned reference and install the Rust and C++ toolchains.

inputs:
  msrv:
    description: Also install the toolchain named by rust-version in Cargo.toml.
    default: "false"
  oracle:
    description: Install the C++ standard library the original oracle links against.
    default: "true"

runs:
  using: composite
  steps:
    - name: Initialize the pinned reference and codec dependencies
      shell: bash
      run: |
        git submodule update --init --depth 1 upstream/libjxl
        git -C upstream/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
    - name: Install Rust toolchains
      shell: bash
      env:
        MSRV: ${{ inputs.msrv }}
      run: |
        toolchains=(stable)
        if [ "$MSRV" = true ]; then
          toolchains+=("$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)")
        fi
        rustup toolchain install "${toolchains[@]}" --profile minimal --component rustfmt --component clippy
    - name: Install the Linux reference standard library
      if: inputs.oracle == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libc++-dev libc++abi-dev
    - name: Use every runner core for differential tests
      shell: bash
      run: echo "RUST_TEST_THREADS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
