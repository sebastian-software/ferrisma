[workspace]
members = ["crates/sharpyuv"]
resolver = "2"

[package]
name = "libavif-rs"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Mechanical Rust port of the pinned libavif implementation"
publish = false

[lib]
name = "avif"
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
libc = "=0.2.191"
sharpyuv = { package = "libavif-sharpyuv", path = "crates/sharpyuv" }

[features]
default = []
mini = []
extended-pixi = []
libgav1 = []
rav1e = []
svt = []
libyuv = []
avm = []

[profile.dev]
overflow-checks = false
panic = "abort"

[profile.dev.package.libavif-sharpyuv]
# LLVM performs reference-compatible contraction at this level. Debug assertions
# remain enabled. This preserves expressions; see ADR 0021.
opt-level = 1

[profile.release]
overflow-checks = false
panic = "abort"
