[workspace]
# One source and dependency graph; codec verification stays scoped (ADR-0026).
members = [
    ".",
    "crates/ferrisma-kernels",
    "crates/ferrisma-libavif",
    "crates/ferrisma-avif-read",
    "crates/ferrisma-avif-write",
    "crates/ferrisma-jxl-decoder",
    "crates/ferrisma-jxl-encoder",
    "crates/libsharpyuv-core",
    "tools/xtask",
    "codecs/libjpeg-turbo-rs",
    "codecs/libwebp-rs",
    "codecs/libjxl-rs",
    "codecs/libavif-rs",
    "codecs/libavif-rs/crates/aom",
    "codecs/libavif-rs/crates/dav1d",
    "codecs/libavif-rs/crates/dav1d-kernels",
    "codecs/libavif-rs/crates/sharpyuv",
]
default-members = [".", "crates/ferrisma-kernels"]
resolver = "3"
exclude = ["codecs/libwebp-rs/fuzz"]

# AOM maps nonlocal C errors to typed Rust unwinding (codec ADR 0036).
[profile.dev]
panic = "unwind"
[profile.release]
panic = "unwind"

# Optimized verification retains the assertions and arithmetic checks of dev.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# The generated C2Rust packages express C wrapping arithmetic through ordinary
# Rust operators. Preserve their established numeric contract only in these
# packages; the engine and the other ports keep overflow checks (ADR-0026).
[profile.dev.package.ferrisma-libavif]
overflow-checks = false
[profile.dev.package.ferrisma-libaom]
overflow-checks = false
[profile.dev.package.ferrisma-dav1d]
overflow-checks = false
[profile.dev.package.ferrisma-libavif-sharpyuv]
overflow-checks = false
# dav1d's CDEF and inverse transforms are written on fearless_simd
# (libavif-rs ADR 0062, "Kernels written from the algorithm"), whose generic
# vector code is meant to be inlined and optimized. At opt-level 0 it is not:
# every temporary keeps its own stack slot, so the AVX2 itx first pass needed
# frames of up to 2.4 MB (dav1d's worker threads have 1 MB stacks: a silent
# SIGSEGV). The kernels are a crate of their own so that only they (and the
# library's own code) are optimized in dev and test; the translated decoder
# stays at opt-level 0. opt-level 1 is enough for the frames (4 KB at most)
# and compiles fastest; full debug info doubles the crate's compile time,
# line tables keep backtraces (single-threaded: 205 s at opt-level 3 with
# full debug info before the passes were shared, 38 s now).
[profile.dev.package.ferrisma-dav1d-kernels]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package.fearless_simd]
opt-level = 1
debug = "line-tables-only"
[profile.checked.package.ferrisma-libavif]
overflow-checks = false
[profile.checked.package.ferrisma-libaom]
overflow-checks = false
[profile.checked.package.ferrisma-dav1d]
overflow-checks = false
[profile.checked.package.ferrisma-libavif-sharpyuv]
overflow-checks = false

[profile.release.package.ferrisma-avif-adapter]
debug = "line-tables-only"

[package]
name = "ferrisma"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Sebastian Software GmbH"]
description = "Experimental pipeline-first Rust image processing engine"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["image", "avif", "webp", "jpeg-xl", "resize"]
categories = ["multimedia::images"]
# Package only what a dependent build, the documentation, and the license
# obligations need; nested workspace packages are excluded by Cargo anyway.
# The integration tests and their fixtures (`tests/`, 2.1 MB of the 2.9 MB)
# stay in the repository: a dependent never builds them, and the unit tests
# in `src` that embed fixtures compile only under `cfg(test)`.
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/THIRD-PARTY-NOTICES.md",
    "/assets/icc/**",
    "/src/**",
    "/examples/**",
]
publish = false

# docs.rs builds with its own nightly; keep the generated AVIF code (pinned
# nightly, native targets only) out of the documentation build.
[package.metadata.docs.rs]
no-default-features = true
features = ["jpeg-read", "webp-read", "webp-write", "jpeg-xl-read", "icc"]

[features]
default = []
jpeg-read = ["dep:ferrisma-libjpeg-turbo"]
webp-read = ["dep:ferrisma-libwebp"]
webp-write = ["dep:ferrisma-libwebp"]
# The JPEG XL reader: the workspace libjxl-rs port, the only one (ADR-0032).
# Until 2026-11-15 this name selected jxl-oxide and the port was
# `jpeg-xl-own-read` (working decision 2026-11-15, delegated, revisable by
# the owner).
jpeg-xl-read = ["dep:ferrisma-jxl-decoder"]
# Experimental JPEG XL output through the workspace libjxl-rs encoder's
# admitted profiles (ADR-0039): lossless through the port's safe fixed-profile
# entry point, lossy through the `ferrisma-jxl-encoder` safe bridge. Part of
# `cli`; distributing a binary still requires the license review (#66).
jpeg-xl-write = ["dep:ferrisma-libjxl", "dep:ferrisma-jxl-encoder"]
avif-read = ["dep:ferrisma-avif-read"]
# The AVIF writer: the workspace libavif/AOM port, the only one (ADR-0037).
# Until 2026-11-15 this name selected rav1e and the port was `avif-write`
# (working decision 2026-11-15, delegated, revisable by the owner).
avif-write = ["dep:ferrisma-avif-write"]
icc = ["dep:moxcms"]
cli = ["jpeg-read", "webp-read", "jpeg-xl-read", "avif-read", "avif-write", "webp-write", "jpeg-xl-write", "icc"]


[dependencies]
# The kernels and the four bridges are internal to `ferrisma` and follow no
# SemVer of their own, so `ferrisma` requires exactly the version released
# with it (ADR-0040 problem 7, amendment of 2026-11-16). Release Please drops
# the `=`; `publishing/release-please/preserve-exact-pins.mjs` restores it.
# First-party, unconditional: the engine's kernels with runtime ISA dispatch.
ferrisma-kernels = { path = "crates/ferrisma-kernels", version = "=0.1.0" }
ferrisma-avif-read = { path = "crates/ferrisma-avif-read", version = "=0.0.0", optional = true }
ferrisma-avif-write = { path = "crates/ferrisma-avif-write", version = "=0.0.0", optional = true }
moxcms = { version = "0.9.1", optional = true, features = ["extended_range"] }
# The workspace decoder exposes safe RGB scanlines; SIMD stays inside its codec boundary.
ferrisma-libjpeg-turbo = { path = "codecs/libjpeg-turbo-rs", version = "0.1.0", optional = true }
ferrisma-libwebp = { path = "codecs/libwebp-rs", version = "0.1.0", optional = true }
ferrisma-jxl-decoder = { path = "crates/ferrisma-jxl-decoder", version = "=0.1.0", optional = true }
# Safe fixed-profile encoder entry point of the workspace port (ADR-0039).
ferrisma-libjxl = { path = "codecs/libjxl-rs", version = "0.1.0", optional = true }
# Safe bridge to the port's public (raw-pointer) encoder API for lossy output.
ferrisma-jxl-encoder = { path = "crates/ferrisma-jxl-encoder", version = "=0.1.0", optional = true }

[dev-dependencies]
# Test-only since 2026-11-15 (ADR-0032): an independent JPEG XL decoder that
# cross-checks the samples of the workspace reader and the encoder's output.
# It is not a reader of the engine and no feature enables it.
jxl-oxide = { version = "0.12.6", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "ferrisma"
path = "src/bin/ferrisma.rs"
required-features = ["cli"]

[[example]]
name = "batch"
required-features = ["cli"]

[[example]]
name = "jpeg_decode_bench"
required-features = ["jpeg-read"]

[[example]]
name = "avif_reference_crosscheck"
required-features = ["avif-read"]
