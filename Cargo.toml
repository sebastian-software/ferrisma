[workspace]
# One source and dependency graph; codec verification stays scoped (ADR-0026).
members = [
    ".",
    "crates/ferrisma-kernels",
    "crates/ferrisma-libavif",
    "crates/ferrisma-avif-read",
    "crates/ferrisma-avif-write",
    "crates/ferrisma-jxl-decoder",
    "crates/libsharpyuv-core",
    "tools/xtask",
    "codecs/libjpeg-turbo-rs",
    "codecs/libwebp-rs",
    "codecs/libjxl-rs",
    "codecs/libavif-rs",
    "codecs/libavif-rs/crates/aom",
    "codecs/libavif-rs/crates/dav1d",
    "codecs/libavif-rs/crates/sharpyuv",
]
default-members = [".", "crates/ferrisma-kernels"]
resolver = "3"
exclude = ["codecs/libwebp-rs/fuzz"]

# AOM maps nonlocal C errors to typed Rust unwinding (codec ADR 0036).
[profile.dev]
panic = "unwind"
[profile.release]
panic = "unwind"

# Optimized verification retains the assertions and arithmetic checks of dev.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# The generated C2Rust packages express C wrapping arithmetic through ordinary
# Rust operators. Preserve their established numeric contract only in these
# packages; the engine and the other ports keep overflow checks (ADR-0026).
[profile.dev.package.libavif-rs]
overflow-checks = false
[profile.dev.package.libavif-aom]
overflow-checks = false
[profile.dev.package.libavif-dav1d]
overflow-checks = false
[profile.dev.package.libavif-sharpyuv]
overflow-checks = false
[profile.checked.package.libavif-rs]
overflow-checks = false
[profile.checked.package.libavif-aom]
overflow-checks = false
[profile.checked.package.libavif-dav1d]
overflow-checks = false
[profile.checked.package.libavif-sharpyuv]
overflow-checks = false

[profile.release.package.ferrisma-libavif]
debug = "line-tables-only"

[package]
name = "ferrisma"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Sebastian Software GmbH"]
description = "Experimental pipeline-first Rust image processing engine"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["image", "avif", "webp", "jpeg-xl", "resize"]
categories = ["multimedia::images"]
# Package only what a dependent build, the documentation, and the license
# obligations need; nested workspace packages are excluded by Cargo anyway.
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/THIRD-PARTY-NOTICES.md",
    "/assets/icc/**",
    "/src/**",
    "/examples/**",
    "/tests/**",
]
publish = false

# docs.rs builds with its own nightly and without NASM; keep the generated
# AVIF code (pinned nightly) and rav1e's assembly out of the documentation build.
[package.metadata.docs.rs]
no-default-features = true
features = ["jpeg-read", "webp-read", "webp-write", "jpeg-xl-read", "jpeg-xl-own-read", "icc"]

[features]
default = []
jpeg-read = ["dep:libjpeg-turbo-rs"]
webp-read = ["dep:webp"]
webp-write = ["dep:webp"]
jpeg-xl-read = ["dep:jxl-oxide"]
# Explicit reference-port experiment; runtime selection remains opt-in.
jpeg-xl-own-read = ["dep:ferrisma-jxl-decoder"]
# Experimental lossless JPEG XL output through the workspace libjxl-rs
# encoder's admitted fixed profile (ADR-0039); not part of `cli` yet.
jpeg-xl-write = ["dep:jxl"]
# rav1e's `asm` is bit-exact and about 2.2x faster; `threading` lets the
# encoder use `TransformOptions::encoder_threads` (M2 work package 2, ADR-0018).
avif-write = ["dep:rav1e", "dep:avif-serialize", "rav1e/asm", "rav1e/threading"]
avif-read = ["dep:ferrisma-avif-read"]
avif-own-write = ["dep:ferrisma-avif-write"]
icc = ["dep:moxcms"]
cli = ["jpeg-read", "webp-read", "jpeg-xl-read", "avif-read", "avif-write", "avif-own-write", "webp-write", "icc"]


[dependencies]
# First-party, unconditional: the engine's kernels with runtime ISA dispatch.
ferrisma-kernels = { path = "crates/ferrisma-kernels", version = "0.1.0" }
rav1e = { version = "0.8.1", optional = true, default-features = false }
avif-serialize = { version = "0.8.9", optional = true }
ferrisma-avif-read = { path = "crates/ferrisma-avif-read", version = "0.0.0", optional = true }
ferrisma-avif-write = { path = "crates/ferrisma-avif-write", version = "0.0.0", optional = true }
moxcms = { version = "0.9.1", optional = true, features = ["extended_range"] }
# The workspace decoder exposes safe RGB scanlines; SIMD stays inside its codec boundary.
libjpeg-turbo-rs = { path = "codecs/libjpeg-turbo-rs", version = "0.1.0", optional = true }
webp = { package = "libwebp-rs", path = "codecs/libwebp-rs", version = "0.1.0", optional = true }
ferrisma-jxl-decoder = { path = "crates/ferrisma-jxl-decoder", version = "0.1.0", optional = true }
jxl-oxide = { version = "0.12.6", optional = true, default-features = false }
# Safe fixed-profile encoder entry point of the workspace port (ADR-0039).
jxl = { package = "libjxl-rs", path = "codecs/libjxl-rs", version = "0.1.0", optional = true }

[dev-dependencies]
# Test-only: writes the identity-matrix AVIF fixture of the AVIF reader tests.
ravif = { version = "0.13.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "ferrisma"
path = "src/bin/ferrisma.rs"
required-features = ["cli"]

[[example]]
name = "batch"
required-features = ["cli"]

[[example]]
name = "jpeg_decode_bench"
required-features = ["jpeg-read"]
