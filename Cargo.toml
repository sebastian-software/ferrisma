[package]
name = "libwebp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "BSD-3-Clause"
description = "A mechanical Rust port of libwebp, the WebP reference implementation"
publish = false

[lib]
name = "webp"
# The rlib serves Rust callers and the tests. The static and dynamic libraries
# will export the C ABI of the public headers (src/abi, ADR 0004) for the
# unmodified upstream tools. Building them compiles and links no C.
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
# The C oracle is a set of probe executables used by differential tests, never
# a dependency of the library (ADR 0002). Without this feature a test that needs
# the oracle skips with a message when LIBWEBP_ORACLE_DIR is unset; with it, the
# test fails instead. tools/check.py --oracle builds the oracle and enables it.
oracle = []

# Optimized test builds that keep every overflow check and debug assertion. The
# port mirrors C unsigned arithmetic with explicit wrapping operations, so an
# omitted one only surfaces with overflow checks enabled.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
