[workspace]
members = ["crates/sharpyuv", "crates/dav1d", "crates/aom"]
resolver = "2"

[package]
name = "libavif-rs"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Mechanical Rust port of the pinned libavif implementation"
publish = false

[lib]
name = "avif"
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
libc = "=0.2.191"
sharpyuv = { package = "libavif-sharpyuv", path = "crates/sharpyuv" }
dav1d = { package = "libavif-dav1d", path = "crates/dav1d" }
aom = { package = "libavif-aom", path = "crates/aom" }

[features]
default = []
mini = []
extended-pixi = []
libgav1 = []
rav1e = []
svt = []
libyuv = []
avm = []

[profile.dev]
overflow-checks = false
panic = "unwind"

[profile.release]
overflow-checks = false
panic = "unwind"

# The Debug translation profile (selected by `debug_assertions`) built with
# Release optimization. Pull requests run the SIMD kernel tests in this
# profile; the unoptimized `dev` run moves to nightly (ADR 0059).
[profile.checked]
inherits = "release"
debug-assertions = true
