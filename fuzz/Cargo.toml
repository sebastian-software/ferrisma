[package]
name = "ferrisma-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferrisma = { path = "..", features = ["cli"] }
# Reads the JPEG XL output lane's results back (already in the graph via `cli`).
ferrisma-jxl-decoder = { path = "../crates/ferrisma-jxl-decoder" }

[[bin]]
name = "transcode"
path = "fuzz_targets/transcode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcode_jxl_out"
path = "fuzz_targets/transcode_jxl_out.rs"
test = false
doc = false
bench = false

# This is a separate workspace, so preserve the root workspace's generated
# AVIF arithmetic exceptions here as well, including cargo-fuzz's release build.
[profile.dev.package.ferrisma-libavif]
overflow-checks = false
[profile.dev.package.libavif-aom]
overflow-checks = false
[profile.dev.package.libavif-dav1d]
overflow-checks = false
[profile.dev.package.libavif-sharpyuv]
overflow-checks = false
[profile.release.package.ferrisma-libavif]
overflow-checks = false
[profile.release.package.libavif-aom]
overflow-checks = false
[profile.release.package.libavif-dav1d]
overflow-checks = false
[profile.release.package.libavif-sharpyuv]
overflow-checks = false

[workspace]
