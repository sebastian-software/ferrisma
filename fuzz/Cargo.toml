[package]
name = "ferrisma-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
own-jxl = ["ferrisma/jpeg-xl-own-read"]

[dependencies]
libfuzzer-sys = "0.4"
ferrisma = { path = "..", features = ["cli"] }

[[bin]]
name = "transcode"
path = "fuzz_targets/transcode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcode_own_avif"
path = "fuzz_targets/transcode_own_avif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcode_own_jxl"
path = "fuzz_targets/transcode_own_jxl.rs"
required-features = ["own-jxl"]
test = false
doc = false
bench = false

# This is a separate workspace, so preserve the root workspace's generated
# AVIF arithmetic exceptions here as well, including cargo-fuzz's release build.
[profile.dev.package.libavif-rs]
overflow-checks = false
[profile.dev.package.libavif-aom]
overflow-checks = false
[profile.dev.package.libavif-dav1d]
overflow-checks = false
[profile.dev.package.libavif-sharpyuv]
overflow-checks = false
[profile.release.package.libavif-rs]
overflow-checks = false
[profile.release.package.libavif-aom]
overflow-checks = false
[profile.release.package.libavif-dav1d]
overflow-checks = false
[profile.release.package.libavif-sharpyuv]
overflow-checks = false

[workspace]
