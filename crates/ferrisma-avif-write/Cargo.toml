[package]
name = "ferrisma-avif-write"
version = "0.1.0"
edition = "2024"
# C-variadic definitions and core::ffi::VaList are stable since 1.99 (port ADR 0060).
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "Safe still AVIF encoder boundary for the workspace libavif port"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
include = ["/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/src/**"]
publish = ["crates-io"]

[dependencies]
ferrisma-libavif = { path = "../../codecs/libavif-rs", version = "0.1.0" }
