[package]
name = "ferrixel-libavif"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "libavif-rs (Rust AOM) as an output encoder backend for Ferrixel (ADR-0024)"
publish = false

[features]
default = []
# The shared CLI accepts all four inputs. AVIF input and this encoder now
# use the same workspace libavif package and isolated safe boundaries.
cli = ["ferrixel/jpeg-read", "ferrixel/webp-read", "ferrixel/jpeg-xl-read", "ferrixel/avif-read", "ferrixel/icc"]

[dependencies]
ferrixel = { path = "../..", default-features = false, features = ["avif-own-write"] }

[dev-dependencies]
libavif-rs = { path = "../../codecs/libavif-rs", version = "0.1.0" }
ferrixel = { path = "../..", default-features = false, features = ["jpeg-read"] }

[[bin]]
name = "ferrixel-libavif"
path = "src/bin/ferrixel-libavif.rs"
required-features = ["cli"]
