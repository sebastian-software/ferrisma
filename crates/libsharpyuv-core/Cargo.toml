[package]
name = "ferrisma-sharpyuv"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
description = "Shared SharpYUV 0.4.2 RGB to YUV conversion core"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
include = ["/Cargo.toml", "/README.md", "/LICENSES/**", "/src/**"]
publish = ["crates-io"]

[features]
default = []

[lib]
# The library keeps its name across the package rename (#207).
name = "libsharpyuv_core"
