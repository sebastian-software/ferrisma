[package]
name = "ferrixel-kernels"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Sebastian Software GmbH"]
description = "Runtime-dispatched SIMD kernels behind a safe API for Ferrixel (ADR-0020)"
repository = "https://github.com/sebastian-software/ferrixel"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
