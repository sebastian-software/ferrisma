[package]
name = "ferrisma-jxl-decoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Safe, bounded-output JPEG XL read bridge to the workspace libjxl-rs port"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
include = ["/Cargo.toml", "/LICENSE-MIT", "/LICENSE-APACHE", "/src/**"]
publish = false

[dependencies]
libjxl-rs = { path = "../../codecs/libjxl-rs", version = "0.1.0" }

[dev-dependencies]
# Comparison-only dependency of this wrapper; the engine also uses it separately.
jxl-oxide = { version = "0.12.6", default-features = false }

[[example]]
name = "jxl_decode_compare"
