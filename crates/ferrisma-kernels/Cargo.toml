[package]
name = "ferrisma-kernels"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Sebastian Software GmbH"]
description = "Runtime-dispatched SIMD kernels behind a safe API for Ferrisma (ADR-0020)"
homepage = "https://ferrisma.dev"
repository = "https://github.com/sebastian-software/ferrisma"
license = "MIT OR Apache-2.0"
readme = "README.md"
include = ["/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/src/**", "/tests/**", "/examples/**"]
publish = false

[dependencies]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
